          </div>
        </details>

        <button class="action" type="submit" id="ok">Ajouter</button>
        <button class="action clair" type="button" id="annuler" hidden>Annuler</button>
        <button class="action clair" type="button" id="nouveau" hidden>Nouvelle personne</button>
        <button class="action danger" type="button" id="supprimer" hidden>Supprimer</button>
      </form>
      </div>
      </div>
      <div id="colD"><div id="vueFamille"></div></div>
      </div>

      <p id="msg" role="status"></p>
      <button id="effacer" type="button">Repartir de zéro</button>
    </aside>
  </div>

  <dialog id="dlgOutil">
    <div class="dlgTete">
      <h2 id="dlgOutilTitre"></h2>
      <button type="button" data-fermer="1" aria-label="Fermer">✕</button>
    </div>
    <div id="dlgOutilCorps"></div>
  </dialog>

  <dialog id="dlgArbres">
    <div class="dlgTete">
      <h2>Tous mes arbres</h2>
      <button type="button" data-a="fermer" aria-label="Fermer">✕</button>
    </div>
    <div id="listeArbres"></div>
    <div class="dlgPied">
      <button type="button" class="action" data-a="creer">Créer un arbre</button>
      <button type="button" class="action clair" data-a="importerGed">Importer un GEDCOM (.ged)</button>
      <button type="button" class="action clair" data-a="importer">Importer un arbre (.json)</button>
    </div>
  </dialog>
  <input type="file" id="impArbre" accept=".json,application/json" hidden>
  <input type="file" id="impGed" accept=".ged,.gedcom,.txt" multiple hidden>
  <input type="file" id="fichierEv" accept="image/*,application/pdf" multiple hidden>

  <script>
    // Plusieurs arbres : tout est rangé dans une seule "base" (CLE3).
    // L'ancienne clé (un seul arbre) est reprise automatiquement au premier lancement.
    const CLE = "arbre-genealogique-v2";
    const CLE3 = "arbres-genealogiques-v3";
    const CHAMPS = ["prenom", "nom", "sexe", "naissance", "lieuNaissance",
                    "deces", "lieuDeces", "pere", "mere", "conjoint",
                    "mariage", "lieuMariage", "divorce", "lieuDivorce",
                    "armee", "unite", "grade", "periodeMilitaire", "matricule"];

    let base = null;
    try {
      const s = localStorage.getItem(CLE3);
      if (s) base = JSON.parse(s);
    } catch (e) {}
    if (!base || !Array.isArray(base.arbres) || !base.arbres.length) {
      let anciens = [];
      try {
        const s = localStorage.getItem(CLE);
        if (s) anciens = JSON.parse(s);
      } catch (e) {}
      base = { courant: "", vue: "famille",
               arbres: [{ id: nouvelId(), nom: "Mon arbre", maj: Date.now(), personnes: anciens }] };
    }
    const arbreCourant = () => base.arbres.find(a => a.id === base.courant) || base.arbres[0];
    base.courant = arbreCourant().id;
    if (!base.reglages) base.reglages = { asc: 4, desc: 1, fratrie: true, conjoint: true };
    if (!base.v4) { base.v4 = 1; base.vue = "arbre"; }   // la nouvelle vue "Arbre" devient la vue par défaut

    let personnes = arbreCourant().personnes;  // les personnes de l'arbre ouvert
    let vue = base.vue || "famille";           // famille, asc, desc, roue ou liste
    let dernier = null;                        // dernière personne ouverte (centre des vues)
    let catEv = "Naissance";                   // événement visé par l'ajout de photo

    let choix = null;      // personne actuellement ouverte dans la fiche
    let ajout = null;      // { type, ref } quand on ajoute un proche
    let confirmer = false; // pour la double confirmation de suppression
    let onglet = "fiche";  // "fiche" (événements) ou "modifier"
    let ficheXL = false;   // true : la fiche occupe toute la page (façon Filae)

    const $ = id => document.getElementById(id);
    const trouver = id => personnes.find(p => p.id === id);

    function sauvegarderBase() {
      base.sync = Date.now();
      let ok = false;
      try { localStorage.setItem(CLE3, JSON.stringify(base)); ok = true; } catch (e) {}
      if (window.cloudPlanifier) window.cloudPlanifier();
      return ok;
    }

    function sauvegarder() {
      const a = arbreCourant();
      a.personnes = personnes;
      a.maj = Date.now();
      return sauvegarderBase();
    }

    function dire(texte) { $("msg").textContent = texte; }

    function echapper(t) {
      return String(t).replace(/[&<>"]/g, c =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    }

    function nouvelId() {
      return "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    }

    function nomComplet(p) {
      return (p.prenom + " " + (p.nom || "").toUpperCase()).trim();
    }

    const aDesParents = p => !!((p.pere && trouver(p.pere)) || (p.mere && trouver(p.mere)));

    // ---------- Dessin de l'arbre ----------

    const MOIS = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet",
                  "août", "septembre", "octobre", "novembre", "décembre"];

    function dateLongue(d) {
      const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(d || "");
      if (m && m[2] >= 1 && m[2] <= 12) return (+m[1] === 1 ? "1er" : +m[1]) + " " + MOIS[m[2] - 1] + " " + m[3];
      return d || "";
    }

    const annee = d => ((d || "").match(/\d{4}/) || [""])[0];
    const initiales = p => ((p.prenom || "?")[0] + ((p.nom || "")[0] || "")).toUpperCase();
    function avatar(p) {
      const d = p.photoId && (p.docs || []).find(x => x.id === p.photoId);
      if (d) return '<img class="av" src="' + d.data + '" alt="">';
      return '<span class="av ' + (p.sexe === "F" ? "f" : "h") + '">' + echapper(initiales(p)) + "</span>";
    }
    const lienNom = p => '<a data-id="' + p.id + '">' + echapper(nomComplet(p)) + "</a>";

    function annees(p) {
      const n = annee(p.naissance), d = annee(p.deces);
      if (n && d) return n + " - " + d;
      if (d) return "† " + d;
      if (n) return (p.sexe === "F" ? "Née" : "Né") + " en " + n;
      return "";
    }

    function texte(mot, date, lieu) {
      if (!date && !lieu) return "";
      return mot + (date ? (/^\d{4}$/.test(date) ? " en " : " le ") + dateLongue(date) : "") + (lieu ? " à " + lieu : "");
    }

    function carte(p, ref) {
      return '<button type="button" class="carte' + (p.id === choix ? " on" : "") + (ref ? " ref" : "") +
        '" data-id="' + p.id + '"' + (ref ? ' title="Cette personne apparaît aussi ailleurs dans l’arbre"' : "") + ">" +
        avatar(p) + '<span class="pn">' + echapper(p.prenom) + "<b>" + echapper((p.nom || "").toUpperCase()) +
        "</b></span><small>" + echapper(annees(p)) + "</small></button>";
    }

    function afficherEntete() {
      const p = choix && trouver(choix), e = $("entete");
      e.hidden = !p;
      if (!p) return;
      const f = p.sexe === "F";
      const lignes = [texte(f ? "Née" : "Né", p.naissance, p.lieuNaissance),
                      texte(f ? "Décédée" : "Décédé", p.deces, p.lieuDeces)].filter(Boolean);
      const mes = p.etiquettes || [];
      e.innerHTML = avatar(p) + "<div><h2>" + echapper(nomComplet(p)) + "</h2>" +
        lignes.map(l => "<p>" + echapper(l) + "</p>").join("") +
        mes.map((x, i) => '<span class="badge">' + echapper(x) + ' <a data-tag="' + i + '" title="Retirer">✕</a></span>').join("") +
        '<br><select id="etiqSel" aria-label="Ajouter une étiquette"><option value="">+ Étiquette</option>' +
        ETIQUETTES.filter(x => !mes.includes(x)).map(x => "<option>" + x + "</option>").join("") +
        "</select></div>";
    }

    // Frise des événements de la vie, comme sur Filae
    function afficherEvenements() {
      const p = choix && trouver(choix), zone = $("vueFiche");
      if (!p) { zone.innerHTML = ""; return; }
      const f = p.sexe === "F";
      const conj = p.conjoint && trouver(p.conjoint);
      const pere = p.pere && trouver(p.pere), mere = p.mere && trouver(p.mere);
      const ev = [];
      const nd = c => (p.docs || []).some(d => d.categorie === c);
      const dl = (date, lieu) => [date ? dateLongue(date) : "", lieu].filter(Boolean).join(", ");
      const ajouter = (date, titre, lignes, fort, cat) =>
        ev.push({ an: annee(date), titre: titre, lignes: lignes.filter(Boolean), fort: fort, cat: cat });

      const parents = [pere, mere].filter(Boolean).map(lienNom).join(" et ");
      if (p.naissance || p.lieuNaissance || nd("Naissance")) {
        ajouter(p.naissance, "Naissance",
          [echapper(dl(p.naissance, p.lieuNaissance)), parents ? (f ? "Fille de " : "Fils de ") + parents : ""], true, "Naissance");
      }
      for (const c of personnes.filter(c => c.pere === p.id || c.mere === p.id)) {
        if (!c.naissance && !c.lieuNaissance) continue;
        const autreId = c.pere === p.id ? c.mere : c.pere, autre = autreId && trouver(autreId);
        ajouter(c.naissance, "Naissance d’un enfant " + lienNom(c) + (autre ? " avec " + lienNom(autre) : ""),
          [echapper(dl(c.naissance, c.lieuNaissance))]);
      }
      if ((conj && (p.mariage || p.lieuMariage)) || nd("Mariage"))
        ajouter(p.mariage, "Mariage" + (conj ? " avec " + lienNom(conj) : ""), [echapper(dl(p.mariage, p.lieuMariage))], true, "Mariage");
      if ((conj && (p.divorce || p.lieuDivorce)) || nd("Divorce"))
        ajouter(p.divorce, "Divorce" + (conj ? " d’avec " + lienNom(conj) : ""), [echapper(dl(p.divorce, p.lieuDivorce))], false, "Divorce");
      if (p.armee || p.unite || p.grade || p.periodeMilitaire || p.matricule || nd("Service militaire")) {
        ajouter(p.periodeMilitaire, "Service militaire",
          [[p.armee, p.grade, p.unite, p.periodeMilitaire, p.matricule ? "Matricule " + p.matricule : ""]
            .filter(Boolean).map(echapper).join(" · ")], false, "Service militaire");
      }
      if (p.deces || p.lieuDeces || nd("Décès"))
        ajouter(p.deces, "Décès", [echapper(dl(p.deces, p.lieuDeces))], true, "Décès");
      for (const [q, mot] of [[pere, "son père"], [mere, "sa mère"]]) {
        if (q && q.deces) ajouter(q.deces, "Décès de " + mot + " " + lienNom(q), [echapper(dl(q.deces, q.lieuDeces))]);
      }

      ev.sort((a, b) => (+a.an || 9999) - (+b.an || 9999));
      const nais = +annee(p.naissance);
      zone.innerHTML = ev.length ? ev.map(e => {
        const age = nais && e.an && e.an - nais > 0 ? "<small>" + (e.an - nais) + " ans</small>" : "";
        return '<div class="ev' + (e.fort ? " fort" : "") + '"><div class="an">' + (e.an || "") + age +
          '</div><div class="pt"></div><div class="corps"><b>' + e.titre + "</b>" +
          e.lignes.map(l => "<span>" + l + "</span>").join("") + (e.cat ? vignettes(p, e.cat) + actionsEv(p, e.cat) : "") + "</div></div>";
      }).join("") : '<p class="doux">Aucun événement pour l’instant. Cliquez sur « Modifier » pour compléter la fiche.</p>';
    }

    const ETIQUETTES = ["À compléter", "Hypothèse", "Impasse", "Complet", "Parents inconnus",
      "Père inconnu", "Mère inconnue", "Enfant unique", "Célibataire", "Sans enfant",
      "Enfant sans vie", "Favori", "Jumeaux", "Invérifiable"];

    const CATEGORIES = ["Photo", "Naissance", "Mariage", "Divorce", "Décès", "Service militaire", "Autre"];
    let catDoc = "Photo"; // catégorie choisie pour les prochains ajouts

    const optionsCat = sel => CATEGORIES.map(c =>
      "<option" + (c === sel ? " selected" : "") + ">" + c + "</option>").join("");

    // Miniatures des documents rattachés à un événement de la frise
    function vignettes(p, cat) {
      const l = (p.docs || []).filter(d => d.categorie === cat);
      if (!l.length) return "";
      return '<div class="vignettes">' + l.map(d => d.type === "pdf"
        ? '<button type="button" class="pdf" data-ouvrir="' + d.id + '">PDF</button>'
        : '<img src="' + d.data + '" alt="' + echapper(d.nom) + '" data-ouvrir="' + d.id + '">').join("") + "</div>";
    }

    function mini(q) {
      return '<button type="button" class="mini" data-id="' + q.id + '">' + avatar(q) +
        "<span><b>" + echapper(nomComplet(q)) + "</b><small>" + echapper(annees(q)) + "</small></span></button>";
    }

    function afficherFamille() {
      const p = choix && trouver(choix), z = $("vueFamille");
      if (!p) { z.innerHTML = ""; return; }
      const parents = [p.pere, p.mere].map(id => id && trouver(id)).filter(Boolean);
      const fratrie = personnes.filter(c => c.id !== p.id && ((p.pere && c.pere === p.pere) || (p.mere && c.mere === p.mere)));
      const conj = p.conjoint && trouver(p.conjoint);
      const enfants = personnes.filter(c => c.pere === p.id || c.mere === p.id);
      const bloc = (titre, liste) => "<h3>" + titre + "</h3>" +
        (liste.length ? liste.map(q => mini(q)).join("") : '<p class="doux">—</p>');
      z.innerHTML = bloc("Parents", parents) + bloc("Frères et sœurs", fratrie) +
        bloc("Conjoint(e)", conj ? [conj] : []) + bloc("Enfants", enfants);
    }

    function afficherDocs() {
      const p = choix && trouver(choix), z = $("vueDocs");
      if (!p) { z.innerHTML = ""; return; }
      const docs = p.docs || [];
      z.innerHTML = '<label class="cat">Ce document concerne :<select id="catDoc">' + optionsCat(catDoc) + "</select></label>" +
        '<label class="envoi">+ Ajouter une photo ou un document' +
        '<input type="file" id="fichier" accept="image/*,application/pdf" multiple hidden></label>' +
        (docs.length ? '<div class="galerie">' + docs.map(d =>
          '<div class="doc">' +
          (d.type === "pdf"
            ? '<button type="button" class="pdf" data-ouvrir="' + d.id + '">PDF</button>'
            : '<img src="' + d.data + '" alt="' + echapper(d.nom) + '" data-ouvrir="' + d.id + '">') +
          "<span>" + echapper(d.nom) + (p.photoId === d.id ? " (photo de profil)" : "") + "</span>" +
          '<select data-cat="' + d.id + '" aria-label="Rattaché à">' + optionsCat(d.categorie || "Photo") + "</select>" +
          '<div class="outils">' + (d.type === "pdf" ? "" : '<a data-profil="' + d.id + '">Photo de profil</a>') +
          '<a data-suppr="' + d.id + '">Supprimer</a></div></div>').join("") + "</div>"
        : '<p class="doux">Aucune photo ni document pour l’instant. Les images sont réduites automatiquement ; les PDF sont limités à 1 Mo.</p>');
    }

    function afficherNotes() {
      const p = choix && trouver(choix), z = $("vueNotes");
      if (!p) { z.innerHTML = ""; return; }
      z.innerHTML = '<textarea id="texteNote" aria-label="Nouvelle note" placeholder="Une anecdote, une source, une hypothèse…"></textarea>' +
        '<button class="action" type="button" id="ajoutNote">Ajouter la note</button>' +
        (p.notes || []).slice().reverse().map(n =>
          '<div class="note"><small>' + echapper(n.date) + ' · <a data-suppr-note="' + n.id + '">Supprimer</a></small>' +
          echapper(n.texte) + "</div>").join("");
    }

    function reduireImage(f) {
      return new Promise((ok, ko) => {
        const r = new FileReader();
        r.onerror = () => ko(new Error("Lecture impossible : " + f.name));
        r.onload = () => {
          const img = new Image();
          img.onerror = () => ko(new Error("Image illisible : " + f.name));
          img.onload = () => {
            const k = Math.min(1, 1000 / Math.max(img.width, img.height));
            const c = document.createElement("canvas");
            c.width = Math.round(img.width * k);
            c.height = Math.round(img.height * k);
            const x = c.getContext("2d");
            x.fillStyle = "#fff";
            x.fillRect(0, 0, c.width, c.height);
            x.drawImage(img, 0, 0, c.width, c.height);
            ok({ type: "image", data: c.toDataURL("image/jpeg", 0.75) });
          };
          img.src = r.result;
        };
        r.readAsDataURL(f);
      });
    }

    function lirePdf(f) {
      return new Promise((ok, ko) => {
        if (f.size > 1000000) { ko(new Error("PDF trop lourd (1 Mo maximum) : " + f.name)); return; }
        const r = new FileReader();
        r.onerror = () => ko(new Error("Lecture impossible : " + f.name));
        r.onload = () => ok({ type: "pdf", data: r.result });
        r.readAsDataURL(f);
      });
    }

    function versBlob(url) {
      const [entete, base] = url.split(",");
      const type = /:(.*?);/.exec(entete)[1];
      const bin = atob(base), tab = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) tab[i] = bin.charCodeAt(i);
      return new Blob([tab], { type: type });
    }

    // Un "noeud" = une personne (avec son conjoint) et tous ses descendants
    function noeud(p, vus) {
      const conj = p.conjoint && trouver(p.conjoint);
      vus.add(p.id);
      if (conj) vus.add(conj.id);

      let html = '<div class="couple">';
      if (conj) {
        const [a, b] = (p.sexe === "F" && conj.sexe === "H") ? [conj, p] : [p, conj];
        const date = p.mariage || conj.mariage;
        const lieu = p.lieuMariage || conj.lieuMariage;
        const div = p.divorce || conj.divorce;
        const lieuDiv = p.lieuDivorce || conj.lieuDivorce;
        html += carte(a) + '<span class="lien"><span class="trait"></span></span>' + carte(b);
      } else {
        html += carte(p);
      }
      html += "</div>";

      const ids = conj ? [p.id, conj.id] : [p.id];
      const enfants = personnes.filter(c => ids.includes(c.pere) || ids.includes(c.mere));
      let sous = "";
      for (const c of enfants) {
        if (vus.has(c.id)) {
          sous += '<li><div class="couple">' + carte(c, true) + "</div></li>";
        } else {
          sous += noeud(c, vus);
        }
      }
      if (sous) html += "<ul>" + sous + "</ul>";

      return "<li>" + html + "</li>";
    }

    // ---------- Arbre déplaçable (style Filae) : ascendants au-dessus, fratrie sur la ligne, enfants dessous ----------

    const CW = 112, CH = 138, SW = 134, RP = 208, PADX = 40, PADT = 46, PADB = 40;
    let vp = { x: 0, y: 0, s: 1, perso: false }, mondeInfo = null;
    const parNaissance = l => l.slice().sort((a, b) => (+annee(a.naissance) || 9999) - (+annee(b.naissance) || 9999));

    function appliquerVue() {
      const m = $("monde");
      if (m) m.style.transform = "translate(" + vp.x + "px," + vp.y + "px) scale(" + vp.s + ")";
    }

    function vueCentre(zone, tout) {
      const i = mondeInfo, cw = zone.clientWidth, ch = zone.clientHeight;
      if (!i || !cw || !ch) return;
      if (tout) {
        vp.s = Math.max(.2, Math.min(1, cw / i.W, ch / i.H));
        vp.perso = true;
        vp.x = (cw - i.W * vp.s) / 2; vp.y = (ch - i.H * vp.s) / 2;
      } else {
        if (!vp.perso) vp.s = Math.min(1, Math.max(.6, cw / i.W));
        vp.x = cw / 2 - i.fx * vp.s;
        vp.y = i.H * vp.s <= ch ? (ch - i.H * vp.s) / 2 : ch * 0.7 - i.fy * vp.s;
      }
      appliquerVue();
    }

    function zoomerAutour(mx, my, k) {
      const s = Math.min(2, Math.max(.2, vp.s * k)), kk = s / vp.s;
      vp.x = mx - (mx - vp.x) * kk; vp.y = my - (my - vp.y) * kk; vp.s = s; vp.perso = true;
      appliquerVue();
    }

    function afficherPedigree(zone) {
      const R = base.reglages, G = R.asc, D = R.desc, f0 = racineVue();
      const noeuds = [], chev = [], phs = [], couples = [], fam = [];
      let slot = 0, maxRow = G >= 1 ? 1 : 0;

      // Ascendants : chaque personne est placée au milieu de ses parents
      function lay(p, g) {
        if (g > maxRow) maxRow = g;
        const f = p.pere && trouver(p.pere), m = p.mere && trouver(p.mere);
        let x;
        if (g < G && (f || m)) {
          const fx = f ? lay(f, g + 1) : null, mx = m ? lay(m, g + 1) : null;
          if (f && m) {
            x = (fx + mx) / 2;
            couples.push({ row: g + 1, a: fx, b: mx });
            fam.push({ x: x, row: g + 1, lien: true, xs: [x], rowK: g });
          } else {
            x = f ? fx : mx;
            fam.push({ x: x, row: g + 1, lien: false, xs: [x], rowK: g });
          }
        } else {
          x = slot++;
          if (f || m) chev.push({ id: p.id, x: x, row: g });
        }
        noeuds.push({ p: p, x: x, row: g });
        return x;
      }

      let M = 0;
      if (G >= 1) {
        const f = f0.pere && trouver(f0.pere), m = f0.mere && trouver(f0.mere);
        let fx, mx;
        if (f) fx = lay(f, 1); else { fx = slot++; phs.push({ x: fx, row: 1, t: "pere", pour: f0.id }); }
        if (m) mx = lay(m, 1); else { mx = slot++; phs.push({ x: mx, row: 1, t: "mere", pour: f0.id }); }
        M = (fx + mx) / 2;
        couples.push({ row: 1, a: fx, b: mx });
      }

      // Ligne de la personne : fratrie (+ conjoint à côté d'elle)
      const sibs = R.fratrie ? personnes.filter(c => c.id !== f0.id && ((f0.pere && c.pere === f0.pere) || (f0.mere && c.mere === f0.mere))) : [];
      const conj = R.conjoint && f0.conjoint ? trouver(f0.conjoint) : null;
      const items = [];
      for (const q of parNaissance(sibs.concat([f0]))) {
        items.push({ p: q, sib: true });
        if (q === f0 && conj) items.push({ p: conj, sib: false });
      }
      const start = M - (items.length - 1) / 2;
      let xf = 0, xsp = 0;
      items.forEach((it, i) => {
        it.x = start + i;
        noeuds.push({ p: it.p, x: it.x, row: 0 });
        if (it.p === f0) xf = it.x;
        if (conj && it.p === conj) xsp = it.x;
      });
      if (G >= 1) fam.push({ x: M, row: 1, lien: true, xs: items.filter(it => it.sib).map(it => it.x), rowK: 0 });
      if (conj) couples.push({ row: 0, a: xf, b: xsp });

      // Descendants
      if (D >= 1) {
        const kids = parNaissance(personnes.filter(c => c.pere === f0.id || c.mere === f0.id || (conj && (c.pere === conj.id || c.mere === conj.id))));
        if (kids.length) {
          let loc = 0;
          const nd = [], fd = [];
          const descLay = (q, lvl) => {
            const k = lvl < D ? parNaissance(personnes.filter(c => c.pere === q.id || c.mere === q.id)) : [];
            let x;
            if (k.length) {
              const xs = k.map(c => descLay(c, lvl + 1));
              x = (xs[0] + xs[xs.length - 1]) / 2;
              fd.push({ x: x, row: -lvl, lien: false, xs: xs, rowK: -(lvl + 1) });
            } else x = loc++;
            nd.push({ p: q, x: x, row: -lvl });
            return x;
          };
          const xsK = kids.map(c => descLay(c, 1));
          const ax = conj ? (xf + xsp) / 2 : xf, dec = ax - (xsK[0] + xsK[xsK.length - 1]) / 2;
          nd.forEach(n => { n.x += dec; noeuds.push(n); });
          fd.forEach(f => { f.x += dec; f.xs = f.xs.map(v => v + dec); fam.push(f); });
          fam.push({ x: ax, row: 0, lien: !!conj, xs: xsK.map(v => v + dec), rowK: -1 });
        }
      }

      // Dimensions
      const tous = noeuds.concat(phs);
      const minX = Math.min.apply(null, tous.map(n => n.x)), maxX = Math.max.apply(null, tous.map(n => n.x));
      const minRow = Math.min.apply(null, noeuds.map(n => n.row));
      const W = PADX * 2 + CW + (maxX - minX) * SW, H = PADT + (maxRow - minRow) * RP + CH + PADB;
      const X = x => PADX + CW / 2 + (x - minX) * SW, Y = r => PADT + (maxRow - r) * RP;

      // Traits
      let d = "", liens = "";
      for (const f of fam) {
        const y0 = Y(f.row) + (f.lien ? CH / 2 : CH), yk = Y(f.rowK), yb = yk - 28;
        const lo = Math.min.apply(null, f.xs.concat([f.x])), hi = Math.max.apply(null, f.xs.concat([f.x]));
        if (f.xs.length === 1 && Math.abs(f.xs[0] - f.x) < 1e-6) d += "M" + X(f.x) + " " + y0 + "V" + yk;
        else {
          d += "M" + X(f.x) + " " + y0 + "V" + yb + "M" + X(lo) + " " + yb + "H" + X(hi);
          f.xs.forEach(v => { d += "M" + X(v) + " " + yb + "V" + yk; });
        }
      }
      for (const c of couples) {
        const y = Y(c.row) + CH / 2, xa = X(c.a) + CW / 2, xb = X(c.b) - CW / 2;
        if (xb <= xa) continue;
        liens += '<line x1="' + xa + '" y1="' + y + '" x2="' + xb + '" y2="' + y + '" stroke="#a995dc" stroke-width="2" stroke-dasharray="2 3"/>' +
                 '<circle cx="' + (xa + xb) / 2 + '" cy="' + y + '" r="4" fill="#8d77d4"/>';
      }

      let html = '<div id="monde" style="width:' + W + "px;height:" + H + 'px"><svg width="' + W + '" height="' + H + '">' +
        '<path d="' + d + '" fill="none" stroke="#d8cdf0" stroke-width="2"/>' + liens + "</svg>";
      for (const n of noeuds) html += '<div class="nd" style="left:' + (X(n.x) - CW / 2) + "px;top:" + Y(n.row) + 'px">' + carte(n.p) + "</div>";
      for (const h of phs) html += '<button type="button" class="ph" data-ph="' + h.t + '" data-pour="' + h.pour + '" style="left:' + (X(h.x) - CW / 2) + "px;top:" + Y(h.row) + 'px">+<span>' + (h.t === "pere" ? "Père" : "Mère") + "</span></button>";
      for (const c of chev) html += '<button type="button" class="chev" data-chev="' + c.id + '" title="Voir ses ancêtres" aria-label="Voir ses ancêtres" style="left:' + (X(c.x) - 14) + "px;top:" + (Y(c.row) - 36) + 'px">︿</button>';
      html += "</div>" +
        '<div class="zoomCtl"><button type="button" data-z="+" aria-label="Zoom avant">+</button><button type="button" data-z="-" aria-label="Zoom arrière">−</button>' +
        '<button type="button" data-z="centre" title="Recentrer sur la personne" aria-label="Recentrer">◎</button>' +
        '<button type="button" data-z="tout" title="Voir tout l’arbre" aria-label="Tout voir">⤢</button></div>' +
        '<div class="aideDrag">Glissez pour déplacer · molette pour zoomer</div>';
      zone.innerHTML = html;
      mondeInfo = { W: W, H: H, fx: X(xf), fy: Y(0) + CH / 2 };
      vueCentre(zone, false);
    }

    // ---------- Outils : recherche, suivi, parenté, listes, réglages ----------

    function ouvrirDlg(titre, html) {
      $("dlgOutilTitre").textContent = titre;
      $("dlgOutilCorps").innerHTML = html;
      if (!$("dlgOutil").open) $("dlgOutil").showModal();
    }

    function resultatsRecherche(q) {
      const mots = norm(q).split(/\s+/).filter(Boolean);
      if (!mots.length) return '<p class="doux">Tapez un nom, un prénom ou une commune.</p>';
      const l = personnes.filter(p => { const t = norm(nomComplet(p) + " " + (p.lieuNaissance || "")); return mots.every(m => t.includes(m)); }).slice(0, 60);
      return l.length ? l.map(p => ligneP(p, base.courant, [annees(p), p.lieuNaissance].filter(Boolean).join(" · "))).join("") : '<p class="doux">Aucune personne trouvée.</p>';
    }

    function dlgSuivi() {
      const inc = personnes.map(p => ({ p: p, m: manques(p) })).filter(x => x.m.length).sort((x, y) => y.m.length - x.m.length);
      const n = f => personnes.filter(f).length;
      ouvrirDlg("Suivi de l’arbre",
        '<div class="statsSuivi"><div><b>' + personnes.length + "</b>personnes</div><div><b>" + n(p => !p.naissance) + "</b>sans date de naissance</div><div><b>" +
        n(p => !p.lieuNaissance) + "</b>sans lieu de naissance</div><div><b>" + n(p => !aDesParents(p)) + "</b>sans parents</div></div>" +
        "<h3>Fiches à compléter (" + inc.length + ")</h3>" +
        (inc.length ? inc.slice(0, 100).map(x => ligneP(x.p, base.courant, "Manque : " + x.m.join(", "))).join("") + (inc.length > 100 ? '<p class="doux">… et ' + (inc.length - 100) + " autres.</p>" : "") : '<p class="doux">Toutes les fiches sont complètes.</p>'));
    }

    // Parenté
    const parenteSel = { A: null, B: null };

    function ancMap(p) {
      const m = new Map([[p.id, { d: 0, via: null }]]);
      let front = [p];
      while (front.length) {
        const nxt = [];
        for (const q of front) for (const pid of [q.pere, q.mere]) {
          const par = pid && trouver(pid);
          if (par && !m.has(par.id)) { m.set(par.id, { d: m.get(q.id).d + 1, via: q.id }); nxt.push(par); }
        }
        front = nxt;
      }
      return m;
    }

    function libelleLien(X, dX, dY, nbCommuns, cote) {
      const g = (h, f) => X.sexe === "H" ? h : X.sexe === "F" ? f : h + " / " + f;
      const sfx = (txt) => cote ? txt + " " + (cote === "p" ? "pater" : "mater") + (X.sexe === "F" ? "nelle" : "nel") : txt;
      if (dX === 0) {
        if (dY === 1) return g("un père", "une mère");
        if (dY === 2) return sfx(g("un grand-père", "une grand-mère"));
        if (dY === 3) return sfx(g("un arrière-grand-père", "une arrière-grand-mère"));
        if (dY === 4) return sfx(g("un trisaïeul", "une trisaïeule"));
        if (dY === 5) return sfx(g("un quadrisaïeul", "une quadrisaïeule"));
        return sfx(g("un ancêtre direct", "une ancêtre directe")) + " (" + dY + " générations)";
      }
      if (dY === 0) {
        if (dX === 1) return g("un fils", "une fille");
        if (dX === 2) return g("un petit-fils", "une petite-fille");
        if (dX === 3) return g("un arrière-petit-fils", "une arrière-petite-fille");
        return g("un descendant direct", "une descendante directe") + " (" + dX + " générations)";
      }
      if (dX === 1 && dY === 1) return nbCommuns >= 2 ? g("un frère", "une sœur") : g("un demi-frère", "une demi-sœur");
      if (dX === 1) {
        if (dY === 2) return sfx(g("un oncle", "une tante"));
        if (dY === 3) return sfx(g("un grand-oncle", "une grand-tante"));
        if (dY === 4) return sfx(g("un arrière-grand-oncle", "une arrière-grand-tante"));
        return g("un oncle éloigné", "une tante éloignée") + " (" + dY + " générations)";
      }
      if (dY === 1) {
        if (dX === 2) return g("un neveu", "une nièce");
        if (dX === 3) return g("un petit-neveu", "une petite-nièce");
        if (dX === 4) return g("un arrière-petit-neveu", "une arrière-petite-nièce");
        return g("un neveu éloigné", "une nièce éloignée") + " (" + dX + " générations)";
      }
      const n = Math.min(dX, dY), k = Math.abs(dX - dY);
      let t = n === 2 ? g("un cousin germain", "une cousine germaine") : n === 3 ? g("un cousin issu de germain", "une cousine issue de germain")
        : g("un cousin éloigné", "une cousine éloignée") + " (ancêtre commun à " + n + " générations)";
      if (k) t += ", avec un décalage de " + k + " génération" + (k > 1 ? "s" : "") + (dX > dY ? " (plus jeune)" : " (plus âgé(e))");
      return t;
    }

    // Rôle d'une personne située d générations au-dessus de la personne "bout de branche"
    function roleAsc(d, sexe) {
      const T = [null, ["Père", "Mère"], ["Grand-père", "Grand-mère"], ["Arrière-grand-père", "Arrière-grand-mère"], ["Trisaïeul", "Trisaïeule"], ["Quadrisaïeul", "Quadrisaïeule"]];
      const t = T[d];
      if (!t) return "Ancêtre (" + d + " générations)";
      return sexe === "H" ? t[0] : sexe === "F" ? t[1] : t[0] + " / " + t[1];
    }

    // côté (paternel / maternel) : par quel parent de Y passe le chemin vers l'ancêtre
    function coteDe(Y, ancId, mY) {
      let c = ancId, prev = null;
      while (c && c !== Y.id) { prev = c; c = mY.get(c).via; }
      return prev && Y.pere === prev ? "p" : prev && Y.mere === prev ? "m" : null;
    }

    const IC_CIBLE = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="1.6"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>';
    const carteP = (q, dark, label) => '<div class="pBox' + (dark ? " dark" : "") + '">' + (label ? '<span class="pLab">' + echapper(label) + "</span>" : "") +
      '<div class="pLigne"><button type="button" class="pNom" data-cible="' + q.id + '">' + echapper(nomComplet(q)) + '</button><span class="pAn">' + echapper(annees(q)) +
      '</span><button type="button" class="pCible" data-cible="' + q.id + '" title="Voir dans l’arbre" aria-label="Voir dans l’arbre">' + IC_CIBLE + "</button></div></div>";
    const sousConjoint = q => q ? '<div class="pSp">&amp; <button type="button" class="pNom" data-cible="' + q.id + '">' + echapper(nomComplet(q)) + "</button> <span class=\"pAn\">" + echapper(annees(q)) + "</span></div>" : "";
    const autreParent = (enfant, parent) => { const id = enfant.pere === parent.id ? enfant.mere : enfant.pere; return id ? trouver(id) : null; };

    function diagrammeLien(top, topLab, colA, colB, A, B, dA, dB) {
      // colX = liste des personnes sous l'ancêtre, de l'ancêtre vers la personne
      const colonne = (liste, dEnd, parent) => {
        let h = "";
        liste.forEach((q, i) => {
          const dist = dEnd - 1 - i, fin = i === liste.length - 1;
          h += '<div class="pLien"></div>' + carteP(q, fin, fin ? "" : roleAsc(dist, q.sexe));
          if (!fin) h += sousConjoint(autreParent(liste[i + 1], q));
        });
        return h;
      };
      const premier = (colA[0] || colB[0]);
      const sp = premier ? autreParent(premier, top) : (top.conjoint ? trouver(top.conjoint) : null);
      let h = '<div class="pDiag"><div class="pTop">' + carteP(top, top.id === A.id || top.id === B.id, topLab) +
        (sp ? '<span class="pLienH"></span>' + carteP(sp, false, "") : "") + "</div>";
      if (colA.length && colB.length) {
        h += '<div class="pDeux"><div class="pCol">' + colonne(colA, dA) + '</div><div class="pCol">' + colonne(colB, dB) + "</div></div>";
      } else {
        const c = colA.length ? colA : colB, d = colA.length ? dA : dB;
        h += '<div class="pCol">' + colonne(c, d) + "</div>";
      }
      return h + "</div>";
    }

    function trouverLien(A, B) {
      const nA = "<b>" + echapper(nomComplet(A)) + "</b>", nB = "<b>" + echapper(nomComplet(B)) + "</b>";
      if (A.id === B.id) return { badge: "", phrases: ["C’est la même personne."], diag: "" };
      if (A.conjoint === B.id) return { badge: "Conjoints", phrases: [nA + " et " + nB + " sont conjoints."], diag: '<div class="pDiag"><div class="pTop">' + carteP(A, true, "") + '<span class="pLienH"></span>' + carteP(B, true, "") + "</div></div>" };
      const ma = ancMap(A), mb = ancMap(B);
      let best = null, communs = [];
      ma.forEach((v, id) => {
        if (!mb.has(id)) return;
        const tot = v.d + mb.get(id).d;
        if (!best || tot < best.tot) { best = { tot: tot, id: id }; communs = [id]; }
        else if (tot === best.tot && v.d === ma.get(best.id).d) communs.push(id);
      });
      if (best) {
        const dA = ma.get(best.id).d, dB = mb.get(best.id).d, top = trouver(best.id);
        const cA = dA === 0 && dB >= 2 || (dA === 1 && dB >= 2) ? coteDe(B, best.id, mb) : null;
        const cB = dB === 0 && dA >= 2 || (dB === 1 && dA >= 2) ? coteDe(A, best.id, ma) : null;
        const phrases = [nA + " est " + libelleLien(A, dA, dB, communs.length, cA) + " de " + nB + ".",
                         nB + " est " + libelleLien(B, dB, dA, communs.length, cB) + " de " + nA + "."];
        const montee = []; for (let c = best.id; c; c = ma.get(c).via) montee.push(trouver(c));
        const desc = []; for (let c = best.id; c; c = mb.get(c).via) desc.push(trouver(c));
        const direct = dA === 0 || dB === 0;
        return { badge: direct ? "Lien direct" : "Lien collatéral", phrases: phrases,
                 diag: diagrammeLien(top, direct ? "" : "Ancêtre commun", montee.slice(1), desc.slice(1), A, B, dA, dB) };
      }
      // Pas de lien de sang : recherche d'un lien par alliance
      const adj = new Map(personnes.map(q => [q.id, []]));
      const lie = (a, b, ab, ba) => { if (adj.has(a) && adj.has(b)) { adj.get(a).push([b, ab]); adj.get(b).push([a, ba]); } };
      for (const q of personnes) {
        if (q.pere) lie(q.id, q.pere, "est enfant de", "est parent de");
        if (q.mere) lie(q.id, q.mere, "est enfant de", "est parent de");
        if (q.conjoint && q.id < q.conjoint) lie(q.id, q.conjoint, "est conjoint(e) de", "est conjoint(e) de");
      }
      const prec = new Map([[A.id, null]]);
      let front = [A.id];
      while (front.length && !prec.has(B.id)) {
        const nxt = [];
        for (const id of front) for (const [v, lab] of adj.get(id)) if (!prec.has(v)) { prec.set(v, [id, lab]); nxt.push(v); }
        front = nxt;
      }
      if (!prec.has(B.id)) return { badge: "", phrases: ["Aucun lien trouvé entre ces deux personnes dans cet arbre."], diag: "" };
      const chemin = [];
      for (let c = B.id; c; ) { const pr = prec.get(c); chemin.push([trouver(c), pr ? pr[1] : ""]); c = pr ? pr[0] : null; }
      chemin.reverse();
      const diag = '<div class="pDiag"><div class="pCol">' + chemin.map((x, i) => (i ? '<div class="pLien"></div><div class="etape">' + x[1] + '</div><div class="pLien"></div>' : "") +
        carteP(x[0], i === 0 || i === chemin.length - 1, "")).join("") + "</div></div>";
      return { badge: "Lien par alliance", phrases: [nA + " et " + nB + " sont liés par alliance (" + (chemin.length - 1) + " étape(s))."], diag: diag };
    }

    function majParente() {
      const A = parenteSel.A && trouver(parenteSel.A), B = parenteSel.B && trouver(parenteSel.B);
      ["A", "B"].forEach(k => { const q = parenteSel[k] && trouver(parenteSel[k]); const z = $("dlgOutilCorps").querySelector('[data-sel="' + k + '"]'); if (z) z.innerHTML = q ? mini(q) : '<span class="doux">Aucune personne choisie</span>'; });
      const z = $("parRes");
      if (!z) return;
      if (!A || !B) { z.innerHTML = '<p class="doux">Choisissez deux personnes pour voir leur lien de parenté.</p>'; return; }
      const r = trouverLien(A, B);
      z.innerHTML = (r.badge ? '<span class="pBadge">' + r.badge + "</span>" : "") + r.phrases.map(t => '<p class="pPhrase">' + t + "</p>").join("") + r.diag;
    }

    function dlgParente() {
      const r = racineVue();
      parenteSel.A = r ? r.id : null; parenteSel.B = null;
      const bloc = (k, t) => '<div class="pick"><label>' + t + '</label><input type="search" data-q="' + k + '" placeholder="Rechercher un nom…" autocomplete="off">' +
        '<div data-res="' + k + '"></div><div class="pickSel" data-sel="' + k + '"></div></div>';
      ouvrirDlg("Lien de parenté", '<div class="pickers">' + bloc("A", "Première personne") + bloc("B", "Seconde personne") + '</div><div id="parRes"></div>');
      majParente();
    }

    function dlgReglages() {
      const R = base.reglages;
      const sel = (id, vals, cur) => '<select id="' + id + '">' + vals.map(v => '<option value="' + v + '"' + (v === cur ? " selected" : "") + ">" + v + "</option>").join("") + "</select>";
      ouvrirDlg("Réglages de l’arbre",
        '<div class="reglage"><label for="rgAsc">Générations d’ascendants</label>' + sel("rgAsc", [1, 2, 3, 4, 5, 6], R.asc) + "</div>" +
        '<div class="reglage"><label for="rgDesc">Générations de descendants</label>' + sel("rgDesc", [0, 1, 2], R.desc) + "</div>" +
        '<div class="reglage"><label for="rgFr">Afficher les frères et sœurs</label><input type="checkbox" id="rgFr"' + (R.fratrie ? " checked" : "") + "></div>" +
        '<div class="reglage"><label for="rgCj">Afficher le conjoint</label><input type="checkbox" id="rgCj"' + (R.conjoint ? " checked" : "") + "></div>" +
        '<p class="doux">Plus il y a de générations, plus l’arbre est large : déplacez-le à la souris et zoomez avec la molette.</p>');
    }

    function actionOutil(o) {
      if (o === "recherche") {
        ouvrirDlg("Rechercher une personne", '<input type="search" id="qDlg" placeholder="Nom, prénom ou commune…" autocomplete="off"><div id="resDlg">' + resultatsRecherche("") + "</div>");
        $("qDlg").focus();
      } else if (o === "suivi") dlgSuivi();
      else if (o === "parente") dlgParente();
      else if (o === "imprimer") window.print();
      else if (o === "listes") { vue = "liste"; base.vue = "liste"; sauvegarderBase(); afficherArbre(); }
      else if (o === "reglages") dlgReglages();
    }

    $("outils").addEventListener("click", function (e) {
      const b = e.target.closest("[data-o]");
      if (b) actionOutil(b.dataset.o);
    });

    $("dlgOutil").addEventListener("click", function (e) {
      if (e.target === this || e.target.closest("[data-fermer]")) { this.close(); return; }
      const lp = e.target.closest(".ligneP[data-open]");
      if (lp) { ouvrir(lp.dataset.open); dire(""); this.close(); return; }
      const ci = e.target.closest("[data-cible]");
      if (ci) { ouvrir(ci.dataset.cible); dire(""); this.close(); return; }
      const mn = e.target.closest(".mini[data-id]:not([data-pick])");
      if (mn) { ouvrir(mn.dataset.id); dire(""); this.close(); return; }
      const pk = e.target.closest("[data-pick]");
      if (pk) {
        parenteSel[pk.dataset.pick] = pk.dataset.id;
        const inp = this.querySelector('[data-q="' + pk.dataset.pick + '"]'), res = this.querySelector('[data-res="' + pk.dataset.pick + '"]');
        if (inp) inp.value = ""; if (res) res.innerHTML = "";
        majParente();
      }
    });

    $("dlgOutil").addEventListener("input", function (e) {
      if (e.target.id === "qDlg") { $("resDlg").innerHTML = resultatsRecherche(e.target.value); return; }
      const k = e.target.dataset.q;
      if (!k) return;
      const mots = norm(e.target.value).split(/\s+/).filter(Boolean), z = this.querySelector('[data-res="' + k + '"]');
      if (!mots.length) { z.innerHTML = ""; return; }
      const l = personnes.filter(p => { const t = norm(nomComplet(p)); return mots.every(m => t.includes(m)); }).slice(0, 8);
      z.innerHTML = l.length ? l.map(p => '<button type="button" class="mini" data-pick="' + k + '" data-id="' + p.id + '">' + avatar(p) +
        "<span><b>" + echapper(nomComplet(p)) + "</b><small>" + echapper([annees(p), p.lieuNaissance].filter(Boolean).join(" · ")) + "</small></span></button>").join("") : '<p class="doux">Aucun résultat.</p>';
    });

    $("dlgOutil").addEventListener("change", function (e) {

    // Déplacer l'arbre à la souris / au doigt, zoomer à la molette
    let glisse = null, aBouge = false;
    $("arbre").addEventListener("pointerdown", function (e) {
      if (!this.classList.contains("pedigree") || e.button > 0 || e.target.closest("[data-z]")) return;
      glisse = { x: e.clientX, y: e.clientY, vx: vp.x, vy: vp.y };
      aBouge = false;
    });
    window.addEventListener("pointermove", function (e) {
      if (!glisse) return;
      const dx = e.clientX - glisse.x, dy = e.clientY - glisse.y;
      if (!aBouge && Math.hypot(dx, dy) < 5) return;
      aBouge = true;
      vp.x = glisse.vx + dx; vp.y = glisse.vy + dy;
      $("arbre").classList.add("glisse");
      appliquerVue();
    });
    const finGlisse = () => { glisse = null; $("arbre").classList.remove("glisse"); };
    window.addEventListener("pointerup", finGlisse);
    window.addEventListener("pointercancel", finGlisse);
    $("arbre").addEventListener("click", function (e) {
      if (aBouge) { e.stopImmediatePropagation(); e.preventDefault(); aBouge = false; }
    }, true);
    $("arbre").addEventListener("wheel", function (e) {
      if (!this.classList.contains("pedigree")) return;
      e.preventDefault();
      const r = this.getBoundingClientRect();
      zoomerAutour(e.clientX - r.left, e.clientY - r.top, Math.pow(1.0015, -e.deltaY));
    }, { passive: false });

    // Vue "Famille" : seulement la famille de la personne ouverte (parents, fratrie, conjoint, enfants)
    function familleFocus(p) {
      const trie = l => l.slice().sort((x, y) => (+annee(x.naissance) || 9999) - (+annee(y.naissance) || 9999));
      const li = q => "<li><div class=\"couple\">" + carte(q) + "</div></li>";
      const pere = p.pere && trouver(p.pere), mere = p.mere && trouver(p.mere);
      let html = "";
      if (pere || mere) {
        const fratrie = trie(personnes.filter(c => (pere && c.pere === pere.id) || (mere && c.mere === mere.id)));
        const couple = pere && mere ? carte(pere) + '<span class="lien"><span class="trait"></span></span>' + carte(mere) : carte(pere || mere);
        html += '<div class="entetevue">Parents et fratrie</div><ul><li><div class="couple">' + couple + "</div><ul>" +
          fratrie.map(li).join("") + "</ul></li></ul>";
      }
      const conj = p.conjoint && trouver(p.conjoint);
      const ids = conj ? [p.id, conj.id] : [p.id];
      const enfants = trie(personnes.filter(c => ids.includes(c.pere) || ids.includes(c.mere)));
      if (conj || enfants.length) {
        const [a, b] = conj && p.sexe === "F" && conj.sexe === "H" ? [conj, p] : [p, conj];
        const couple = conj ? carte(a) + '<span class="lien"><span class="trait"></span></span>' + carte(b) : carte(p);
        html += '<div class="entetevue">' + (conj ? "Conjoint(e) et enfants" : "Enfants") + "</div><ul><li><div class=\"couple\">" + couple + "</div>" +
          (enfants.length ? "<ul>" + enfants.map(li).join("") + "</ul>" : "") + "</li></ul>";
      }
      return html || '<div class="vide">Aucun proche renseigné pour cette personne.</div>';
    }

    function afficherArbre() {
      const zone = $("arbre");
      afficherCadre();
      zone.classList.toggle("pedigree", vue === "arbre" && personnes.length > 0);
      if (carteLeaflet && (vue !== "carte" || !personnes.length)) { carteLeaflet.remove(); carteLeaflet = null; }
      if (!personnes.length) {
        zone.innerHTML = '<div class="vide">Votre arbre est vide.<br>Commencez par remplir votre propre fiche, à droite.</div>';
        return;
      }
      if (vue === "carte") { afficherCarte(zone); return; }
      if (vue === "arbre") { afficherPedigree(zone); return; }
      if (vue !== "famille") { zone.innerHTML = vueAlternative(); return; }
      const focus = racineVue();
      if (focus) { zone.innerHTML = familleFocus(focus); return; }
      const vus = new Set();
      let html = "";

      // Les racines : personnes sans parent connu (et dont le conjoint n'a pas de parents affichés)
      const racines = personnes.filter(p => {
        const c = p.conjoint && trouver(p.conjoint);
        return !aDesParents(p) && !(c && aDesParents(c));
      });
      for (const r of racines) {
        if (!vus.has(r.id)) html += noeud(r, vus);
      }
      for (const p of personnes) {
        if (!vus.has(p.id)) html += noeud(p, vus);
      }
      zone.innerHTML = "<ul>" + html + "</ul>";
    }

    // ---------- Photos et documents rattachés à un événement ----------

    async function ajouterFichiers(p, fichiers, cat) {
      const avant = (p.docs || []).slice();

      for (const f of fichiers) {
        try {
          const d = f.type === "application/pdf" ? await lirePdf(f) : await reduireImage(f);

        } catch (err) {

        p.docs = avant;
        erreur = "Espace de stockage du navigateur plein : fichiers non ajoutés.";

      majFiche();

    }

    // ---------- Plusieurs arbres ----------

    function exporterArbre(id) {

    function importerArbre(fichier) {
      const r = new FileReader();
      r.onload = function () {
        try {
          const d = JSON.parse(r.result);
          if (!Array.isArray(d.personnes)) throw new Error("format");
          const a = { id: nouvelId(), nom: (d.nom || "Arbre importé") + " (import)", maj: Date.now(), personnes: d.personnes };
          base.arbres.push(a);
          changerArbre(a.id);
          aller("arbre");
          dire("Arbre importé : " + a.nom);
        } catch (e) {
          alert("Fichier non reconnu : choisissez un arbre exporté depuis ce site (.json).");

      };

    }


    // ---------- Import GEDCOM (.ged) ----------

    const MOIS_GED = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };

    function dateGedcom(d) {
      d = (d || "").trim();
      if (!d) return "";
      const un = x => {
        const m = /^(?:(\d{1,2})\s+)?(?:([a-z]{3})\s+)?(\d{3,4})$/i.exec(x.trim());
        if (!m) return x.trim();
        const mois = m[2] ? MOIS_GED[m[2].toLowerCase()] : 0;
        if (m[2] && !mois) return x.trim();
        const dd = m[1] ? ("0" + m[1]).slice(-2) + "/" : "";
        return (mois ? dd + ("0" + mois).slice(-2) + "/" : "") + m[3];
      };
      let m;
      if ((m = /^(?:bet|between)\s+(.+?)\s+and\s+(.+)$/i.exec(d))) return "entre " + un(m[1]) + " et " + un(m[2]);
      if ((m = /^from\s+(.+?)\s+to\s+(.+)$/i.exec(d))) return "de " + un(m[1]) + " à " + un(m[2]);
      if ((m = /^(abt|about|est|cal|ca)\s+(.+)$/i.exec(d))) return "vers " + un(m[2]);
      if ((m = /^(bef|before)\s+(.+)$/i.exec(d))) return "avant " + un(m[2]);
      if ((m = /^(aft|after)\s+(.+)$/i.exec(d))) return "après " + un(m[2]);
      return un(d);
    }

    function majusculesNom(t) {
      t = (t || "").trim();
      if (t !== t.toLowerCase() && t !== t.toUpperCase()) return t;   // déjà bien écrit
      return t.toLowerCase().replace(/(^|[\s\-'’])(\p{L})/gu, (x, a, b) => a + b.toUpperCase());
    }

    function lireGedcom(texte) {
      // 1) lecture ligne à ligne -> enregistrements { tag, val, xref, sous: [...] }
      const racine = { sous: [] }, pile = [racine];
      for (const brut of texte.replace(/^\uFEFF/, "").split(/\r\n|\r|\n/)) {
        const m = /^\s*(\d+)\s+(?:(@[^@]+@)\s+)?(\S+)(?:\s(.*))?$/.exec(brut);
        if (!m) continue;
        const niv = +m[1], tag = m[3].toUpperCase(), val = m[4] || "";
        if (tag === "CONC" || tag === "CONT") {
          const parent = pile[niv] || pile[pile.length - 1];
          if (parent && parent.tag) parent.val += (tag === "CONT" ? "\n" : "") + val;
          continue;
        }
        const n = { tag: tag, val: val, xref: m[2] || "", sous: [] };
        (pile[niv] || racine).sous.push(n);
        pile[niv + 1] = n;
        pile.length = niv + 2;
      }
      const fils = (n, t) => n.sous.filter(x => x.tag === t);
      const un = (n, t) => fils(n, t)[0];
      const evt = (n, tags) => {
        for (const t of tags) {
          const e = un(n, t);
          if (e && (un(e, "DATE") || un(e, "PLAC"))) {
            return { date: dateGedcom(un(e, "DATE") ? un(e, "DATE").val : ""), lieu: un(e, "PLAC") ? un(e, "PLAC").val.trim() : "" };
          }
        }
        return { date: "", lieu: "" };
      };

      // 2) individus
      const parXref = {}, liste = [];
      let i = 0;
      for (const n of racine.sous) {
        if (n.tag !== "INDI") continue;
        const nomN = un(n, "NAME");
        let prenom = "", nom = "";
        if (nomN) {
          const g = un(nomN, "GIVN"), sn = un(nomN, "SURN");
          const m = /^(.*?)\s*\/(.*?)\/?\s*$/.exec(nomN.val);
          prenom = g ? g.val : (m ? m[1] : nomN.val);
          nom = sn ? sn.val : (m ? m[2] : "");
        }
        const naiss = evt(n, ["BIRT", "CHR", "BAPM"]), dec = evt(n, ["DEAT", "BURI"]);
        const sx = un(n, "SEX");
        const p = {
          id: "g" + (++i).toString(36) + Math.random().toString(36).slice(2, 5),
          prenom: majusculesNom(prenom), nom: majusculesNom(nom),
          sexe: sx && /^[MH]/i.test(sx.val) ? "H" : sx && /^F/i.test(sx.val) ? "F" : "",
          naissance: naiss.date, lieuNaissance: naiss.lieu, deces: dec.date, lieuDeces: dec.lieu,
          pere: "", mere: "", conjoint: "", mariage: "", lieuMariage: "", divorce: "", lieuDivorce: "",
          armee: "", unite: "", grade: "", periodeMilitaire: "", matricule: "", maj: Date.now()
        };
        const notes = [];
        const ajouteNote = t => { if (t && t.trim()) notes.push({ id: nouvelId() + notes.length, texte: t.trim(), date: new Date().toLocaleDateString("fr-FR") }); };
        fils(n, "OCCU").forEach(o => ajouteNote("Profession : " + o.val + (un(o, "DATE") ? " (" + dateGedcom(un(o, "DATE").val) + ")" : "")));
        fils(n, "NOTE").forEach(o => ajouteNote(o.val));
        fils(n, "EVEN").forEach(o => ajouteNote(o.val + (un(o, "DATE") ? " (" + dateGedcom(un(o, "DATE").val) + ")" : "")));
        if (notes.length) p.notes = notes;
        if (!p.prenom && !p.nom) p.prenom = "Inconnu";
        parXref[n.xref] = p;
        liste.push(p);
      }

      // 3) familles : parents, enfants, couple, mariage, divorce
      for (const f of racine.sous) {
        if (f.tag !== "FAM") continue;
        const h = un(f, "HUSB"), w = un(f, "WIFE");
        const pere = h && parXref[h.val], mere = w && parXref[w.val];
        for (const c of fils(f, "CHIL")) {
          const e = parXref[c.val];
          if (!e) continue;
          if (!e.pere && !e.mere) { if (pere) e.pere = pere.id; if (mere) e.mere = mere.id; }
        }
        if (pere && mere && !pere.conjoint && !mere.conjoint) {
          const mar = evt(f, ["MARR"]), div = evt(f, ["DIV"]);
          for (const [a, b] of [[pere, mere], [mere, pere]]) {
            a.conjoint = b.id; a.mariage = mar.date; a.lieuMariage = mar.lieu; a.divorce = div.date; a.lieuDivorce = div.lieu;
          }
        }
      }
      return liste;
    }

    function lireTexteFichier(fichier) {
      return new Promise((ok, ko) => {
        const r = new FileReader();
        r.onload = () => {
          const oct = new Uint8Array(r.result);
          try { ok(new TextDecoder("utf-8", { fatal: true }).decode(oct)); }
          catch (e) { ok(new TextDecoder("windows-1252").decode(oct)); }   // anciens exports ANSI
        };
        r.onerror = ko;
        r.readAsArrayBuffer(fichier);
      });
    }

    async function importerGedcoms(fichiers) {
      let dernierArbre = null, total = 0;
      for (const f of fichiers) {
        try {
          const liste = lireGedcom(await lireTexteFichier(f));
          if (!liste.length) { alert("Aucune personne trouvée dans « " + f.name + " »."); continue; }
          const a = { id: nouvelId(), nom: f.name.replace(/\.(ged|gedcom|txt)$/i, ""), maj: Date.now(), personnes: liste };
          base.arbres.push(a);
          dernierArbre = a; total += liste.length;
        } catch (e) { alert("Impossible de lire « " + f.name + " »."); }
      }
      if (!dernierArbre) return;
      changerArbre(dernierArbre.id);
      if (!sauvegarderBase()) alert("L’arbre est ouvert mais trop volumineux pour être mémorisé par le navigateur : exportez-le en .json pour le garder.");
      aller("arbre");
      dire(total + " personne(s) importée(s) depuis GEDCOM.");
    }

      $("listeArbres").innerHTML = base.arbres.map(a =>
        '<div class="ligneArbre' + (a.id === base.courant ? " cur" : "") + '"><div><b>' + echapper(a.nom) + "</b><small>" +

    // ---------- Formats d'affichage : famille, ascendants, descendants, roue, liste ----------

    const FORMATS = [["arbre", "Arbre"], ["famille", "Famille"], ["asc", "Ascendants"], ["desc", "Descendants"], ["roue", "Roue"], ["liste", "Liste"], ["carte", "Carte"]];

    const racineVue = () => trouver(choix) || trouver(dernier) || personnes[0];

    // Numérotation Sosa : 1 = la personne, 2 = son père, 3 = sa mère, 4 = père du père...
    function ancetres(r) {
      const m = {};
      (function monter(p, s, g) {
        if (!p || g > 7) return;
        m[s] = p;
        monter(p.pere && trouver(p.pere), 2 * s, g + 1);
        monter(p.mere && trouver(p.mere), 2 * s + 1, g + 1);
      })(r, 1, 1);
      return m;
    }

    function nbAscendants(r) {
      const vus = new Set();
      (function monter(p) {
        if (!p || vus.has(p.id)) return;
        vus.add(p.id);
        monter(p.pere && trouver(p.pere));
        monter(p.mere && trouver(p.mere));
      })(r);
      return vus.size - 1;
    }

    const blocStat = (t, v) => "<div><span>" + t + "</span><b>" + v + "</b></div>";

    function afficherCadre() {
      const a = arbreCourant();
      $("nomArbre").textContent = a.nom;
      $("majArbre").textContent = "Dernière mise à jour le " + new Date(a.maj).toLocaleDateString("fr-FR");
      const btns = FORMATS.map(f => '<button type="button" data-v="' + f[0] + '"' + (f[0] === vue && !ficheXL ? ' class="actif"' : "") + ">" + f[1] + "</button>");
      btns.splice(2, 0, '<button type="button" data-xl="1"' + (ficheXL ? ' class="actif"' : "") + ">Fiche</button>");
      $("formats").innerHTML = btns.join("");
    }

    function noeudAsc(p, g) {
      const pere = p.pere && trouver(p.pere), mere = p.mere && trouver(p.mere);
      let h = '<div class="anc">' + carte(p);
      if ((pere || mere) && g < 7) {
        h += '<div class="parents">' + (pere ? noeudAsc(pere, g + 1) : "") + (mere ? noeudAsc(mere, g + 1) : "") + "</div>";
      }
      return h + "</div>";
    }

    function htmlListe() {
      const l = personnes.slice().sort((a, b) =>
        (a.nom || "").localeCompare(b.nom || "", "fr") || (a.prenom || "").localeCompare(b.prenom || "", "fr"));
      return '<table class="liste"><thead><tr><th>Nom</th><th>Prénom</th><th>Naissance</th><th>Lieu</th><th>Décès</th></tr></thead><tbody>' +
        l.map(p => '<tr class="sl' + (p.id === choix ? " on" : "") + '" data-id="' + p.id + '"><td>' + echapper((p.nom || "").toUpperCase()) +
          "</td><td>" + echapper(p.prenom || "") + "</td><td>" + echapper(dateLongue(p.naissance)) + "</td><td>" +
          echapper(p.lieuNaissance || "") + "</td><td>" + echapper(dateLongue(p.deces)) + "</td></tr>").join("") + "</tbody></table>";
    }

    // Roue : demi-cercle des ancêtres, 6 générations, une couleur par grand-parent
    function roue(r) {
      const A = ancetres(r), R0 = 62, W = 66, G = 6, cx = 470, cy = 470;
      const P = (rr, t) => [cx - rr * Math.cos(t), cy - rr * Math.sin(t)];
      const f = x => x.toFixed(1);
      const teintes = { 2: "#fbdde2", 3: "#fdebc8", 4: "#e3dcf7", 5: "#d6ecf7", 6: "#fde0cf", 7: "#e0f1e3" };
      let s = '<svg class="roue" viewBox="0 0 940 535" role="img" aria-label="Roue des ascendants">';
      for (let k = 1; k <= G; k++) {
        const n = 1 << k, r1 = R0 + (k - 1) * W, r2 = r1 + W - 3;
        for (let i = 0; i < n; i++) {
          const sosa = n + i, p = A[sosa];
          const t1 = i * Math.PI / n, t2 = (i + 1) * Math.PI / n, tm = (t1 + t2) / 2;
          const a = P(r2, t1), b = P(r2, t2), c = P(r1, t2), d = P(r1, t1);
          const chemin = "M" + f(a[0]) + " " + f(a[1]) + "A" + r2 + " " + r2 + " 0 0 1 " + f(b[0]) + " " + f(b[1]) +
            "L" + f(c[0]) + " " + f(c[1]) + "A" + r1 + " " + r1 + " 0 0 0 " + f(d[0]) + " " + f(d[1]) + "Z";
          const branche = k === 1 ? sosa : sosa >> (k - 2);
          s += "<g" + (p ? ' class="sl" data-id="' + p.id + '"' : "") + '><path d="' + chemin + '" fill="' +
            (p ? teintes[branche] || "#fff" : "#f3eefa") + '" stroke="#fff" stroke-width="1.5"/>';
          if (p) {
            const rm = (r1 + r2) / 2, xy = P(rm, tm), deg = tm * 180 / Math.PI;
            const radial = k >= 3;
            const rot = radial ? (deg < 90 ? deg : deg - 180) : deg - 90;
            const fs = [0, 13, 12, 11, 10, 9, 8][k];
            const max = radial ? Math.floor(W / (fs * 0.55)) : 16;
            const coupe = t => t.length > max ? t.slice(0, max - 1) + "…" : t;
            const nom1 = coupe(((p.prenom || "").split(" ")[0] + " " + (p.nom || "").toUpperCase()).trim());
            const an = annee(p.naissance) ? annee(p.naissance) + " - " + (annee(p.deces) || "") : "";
            const lignes = k >= 6 || !an ? [nom1] : [nom1, an];
            s += "<title>" + echapper(nomComplet(p)) + "</title>";
            s += '<g transform="translate(' + f(xy[0]) + " " + f(xy[1]) + ") rotate(" + f(rot) + ')">';
            lignes.forEach((t, j) => {
              const y = (j - (lignes.length - 1) / 2) * (fs + 2) + fs * 0.35;
              s += '<text y="' + f(y) + '" font-size="' + (j ? fs - 1 : fs) + '"' + (j ? ' style="fill:#7a7490"' : ' font-weight="700"') + ">" + echapper(t) + "</text>";
            });
            s += "</g>";
          }
          s += "</g>";
        }
      }
      s += '<g class="sl" data-id="' + r.id + '"><circle cx="' + cx + '" cy="' + cy + '" r="' + (R0 - 4) + '" fill="#6c58b8"/>' +
        '<text y="' + (cy - 4) + '" x="' + cx + '" font-size="14" font-weight="700" style="fill:#fff">' + echapper(((r.prenom || "").split(" ")[0])) + "</text>" +
        '<text y="' + (cy + 14) + '" x="' + cx + '" font-size="14" font-weight="700" style="fill:#fff">' + echapper((r.nom || "").toUpperCase()) + "</text></g>";
      return s + "</svg>";
    }

    // ---------- Pages : accueil et arbre ----------

    const norm = t => (t || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
    let pageCourante = "accueil";

    function ouvrirPersonne(arbreId, id, ong) {

    function manques(p) {
      const m = [];
      if (!p.naissance) m.push("date de naissance");
      if (!p.lieuNaissance) m.push("lieu de naissance");
      if (!aDesParents(p)) m.push("parents");

    function ligneP(p, arbreId, sous) {

    function evenementsDuJour() {
      const t = new Date(), j = t.getDate(), m = t.getMonth() + 1, l = [];
      for (const p of personnes) {

          const x = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(p[k] || "");
          if (!x || +x[1] !== j || +x[2] !== m) continue;
          if (k === "mariage" && c && p.id > c.id) continue;
          l.push({ p: p, c: k === "mariage" ? c : null, mot: mot, an: +x[3], ecart: t.getFullYear() - x[3] });
        }

    function afficherAccueil() {
      const a = arbreCourant(), r = racineVue();

      // À compléter
      const incompl = personnes.map(p => ({ p: p, m: manques(p) })).filter(x => x.m.length).sort((x, y) => y.m.length - x.m.length);

      const recents = personnes.map((p, i) => ({ p: p, t: p.maj || 0, i: i })).sort((x, y) => y.t - x.t || y.i - x.i).slice(0, 12);
