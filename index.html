            recents.map(x => carte(x.p)).join("") + '</div><button type="button" data-scroll="1" aria-label="Suivant">›</button></div>'
          : '<div class="vide">Votre arbre est vide.<br><button type="button" class="action" data-nouveau="1">Commencer par ma fiche</button></div>') +
        '<div class="bandeau">' + blocStat("Individus", personnes.length) + blocStat("Ascendants directs", r ? nbAscendants(r) : 0) +
        blocStat("Période", ans.length ? Math.min.apply(null, ans) + " > " + Math.max.apply(null, ans) : "—") + "</div>";

      // Mes arbres
      $("aArbres").innerHTML = '<div class="entete2"><h2>Mes arbres</h2><button type="button" class="plusBtn" data-creer="1" aria-label="Créer un arbre" title="Créer un arbre">+</button></div>' +
        '<button type="button" class="action clair large" data-importged="1">Importer un GEDCOM (.ged)</button>' +
        base.arbres.map(x => '<button type="button" class="ligneT' + (x.id === base.courant ? " cur" : "") + '" data-arbreouvrir="' + x.id + '"><b>' +
          echapper(x.nom) + "</b><small>" + x.personnes.length + " personne(s)</small></button>").join("");

      // Dernières photos (tous les arbres)
      const photos = [];
      for (const ar of base.arbres) for (const p of ar.personnes) for (const d of (p.docs || [])) if (d.type === "image") photos.push({ d: d, p: p, ar: ar });
      photos.sort((x, y) => (y.d.id > x.d.id ? 1 : -1));
      $("aPhotos").innerHTML = "<h2>Dernières photos</h2>" + (photos.length
        ? '<div class="vignesA">' + photos.slice(0, 6).map(x => '<button type="button" class="vign" data-open="' + x.p.id + '" data-arbre="' + x.ar.id +
            '" data-photo="1" title="' + echapper(nomComplet(x.p)) + '"><img src="' + x.d.data + '" alt="' + echapper(x.d.nom) + '"></button>').join("") + "</div>"
        : '<p class="doux">Ajoutez des photos depuis la frise d’une personne : elles apparaîtront ici.</p>');

      // Ce jour dans l'arbre
      const t = new Date(), jour = evenementsDuJour();
      $("aJour").innerHTML = '<p class="jourGros">' + t.getDate() + "<small>" + MOIS[t.getMonth()] + "</small></p>" +
        (jour.length ? jour.slice(0, 4).map(x => '<button type="button" class="evJour" data-open="' + x.p.id + '" data-arbre="' + a.id + '">' + x.mot + " de " +
            echapper(nomComplet(x.p)) + (x.c ? " et " + echapper(nomComplet(x.c)) : "") + "<small>en " + x.an + (x.ecart > 0 ? " · il y a " + x.ecart + " ans" : "") + "</small></button>").join("")
          : '<p class="doux">Aucun événement à cette date dans votre arbre.</p>');
    }

    // ---------- Carte des lieux ----------

    const CLE_GEO = "geo-cache-v1";
    let geo = {};
    try { geo = JSON.parse(localStorage.getItem(CLE_GEO) || "{}"); } catch (e) {}
    let carteLeaflet = null, coucheCarte = null, geoEnCours = false, geoBloque = false;
    const filtresCarte = { qui: "tous", type: "tous", periode: "toutes" };
    const PERIODES = { avant1800: [0, 1799], p1800: [1800, 1899], p1900: [1900, 1949], p1950: [1950, 3000] };
    const SEUILS = [[1, 2, "1-2", "#fdf0c8"], [3, 5, "3-5", "#fbd7b0"], [6, 15, "6-15", "#f6bcc0"], [16, 39, "16-39", "#e0a8d2"], [40, 99, "40-99", "#b9aae0"], [100, 1e9, "100+", "#8fa8dc"]];
    const couleurDensite = n => (SEUILS.find(x => n >= x[0] && n <= x[1]) || SEUILS[0])[3];
    const cleLieu = l => norm(l).replace(/\s+/g, " ").trim();

    function evenementsCarte() {
      const ev = [];
      const ajoute = (type, p, date, lieu, autre) => {
        if (lieu && lieu.trim()) ev.push({ type: type, p: p, autre: autre, an: +annee(date) || 0, lieu: lieu.trim() });
      };
      for (const p of personnes) {
        ajoute("Naissance", p, p.naissance, p.lieuNaissance);
        ajoute("Décès", p, p.deces, p.lieuDeces);
        const c = p.conjoint && trouver(p.conjoint);
        if (!c || p.id < c.id) {   // un seul événement par couple
          ajoute("Mariage", p, p.mariage || (c && c.mariage), p.lieuMariage || (c && c.lieuMariage), c);
          ajoute("Divorce", p, p.divorce || (c && c.divorce), p.lieuDivorce || (c && c.lieuDivorce), c);
        }
      }
      return ev;
    }

    function idsQui() {
      const r = racineVue();
      if (!r || filtresCarte.qui === "tous") return null;
      const vus = new Set();
      if (filtresCarte.qui === "asc") {
        (function m(p) { if (!p || vus.has(p.id)) return; vus.add(p.id); m(p.pere && trouver(p.pere)); m(p.mere && trouver(p.mere)); })(r);
      } else {
        (function d(p) { if (!p || vus.has(p.id)) return; vus.add(p.id); personnes.filter(c => c.pere === p.id || c.mere === p.id).forEach(d); })(r);
      }
      return vus;
    }

    function popupLieu(g) {
      const par = {};
      g.ev.forEach(e => { (par[e.type] = par[e.type] || []).push(e); });
      return "<b>" + echapper(g.nom) + "</b>" + Object.keys(par).map(t =>
        '<div class="pop"><u>' + t + " (" + par[t].length + ")</u>" + par[t].slice(0, 12).map(e =>
          '<a data-pid="' + e.p.id + '">' + echapper(nomComplet(e.p)) + "</a>" +
          (e.autre ? " et " + echapper(nomComplet(e.autre)) : "") + (e.an ? " (" + e.an + ")" : "")).join("<br>") +
        (par[t].length > 12 ? "<br>…" : "") + "</div>").join("");
    }

    // ----- Frontières (pays, régions, départements) chargées à la demande -----
    const PAYS_FR = { "United States of America": "États-Unis", "Brazil": "Brésil", "Germany": "Allemagne", "Belgium": "Belgique", "Italy": "Italie", "Spain": "Espagne",
      "United Kingdom": "Royaume-Uni", "Switzerland": "Suisse", "Poland": "Pologne", "Algeria": "Algérie", "Morocco": "Maroc", "Tunisia": "Tunisie", "Netherlands": "Pays-Bas",
      "Russia": "Russie", "Mexico": "Mexique", "China": "Chine", "Japan": "Japon", "India": "Inde", "Turkey": "Turquie", "Ireland": "Irlande", "Austria": "Autriche", "Sweden": "Suède",
      "Norway": "Norvège", "Denmark": "Danemark", "Greece": "Grèce", "Senegal": "Sénégal", "Vietnam": "Vietnam", "Lebanon": "Liban", "Egypt": "Égypte", "Czech Republic": "Tchéquie",
      "Romania": "Roumanie", "Hungary": "Hongrie", "Ukraine": "Ukraine", "Argentina": "Argentine", "Australia": "Australie", "South Africa": "Afrique du Sud", "Haiti": "Haïti", "Cameroon": "Cameroun" };
    const URLS_GEO = {
      pays: ["https://raw.githubusercontent.com/johan/world.geo.json/master/countries.geo.json", "https://cdn.jsdelivr.net/gh/johan/world.geo.json@master/countries.geo.json"],
      regions: ["https://raw.githubusercontent.com/gregoiredavid/france-geojson/master/regions-version-simplifiee.geojson", "https://cdn.jsdelivr.net/gh/gregoiredavid/france-geojson@master/regions-version-simplifiee.geojson"],
      deps: ["https://raw.githubusercontent.com/gregoiredavid/france-geojson/master/departements-version-simplifiee.geojson", "https://cdn.jsdelivr.net/gh/gregoiredavid/france-geojson@master/departements-version-simplifiee.geojson"]
    };
    let fondsGeo = null, fondsEtat = "", niveauCourant = "", zonesCache = {};

    async function chargerJson(urls) {
      for (const u of urls) { try { const r = await fetch(u); if (r.ok) return await r.json(); } catch (e) {} }
      return null;
    }

    function preparerFonds(pays, regions, deps) {
      const fonds = { pays: [], regions: [], deps: [], france: null, depParNom: {}, regParNom: {}, regDeDep: {} };
      const prep = (col, pre, nomDe) => (col && col.features || []).filter(f => f.geometry).map((f, i) => {
        let xmin = 1e9, xmax = -1e9, ymin = 1e9, ymax = -1e9;
        const polys = f.geometry.type === "Polygon" ? [f.geometry.coordinates] : f.geometry.type === "MultiPolygon" ? f.geometry.coordinates : [];
        polys.forEach(po => po[0].forEach(c => { if (c[0] < xmin) xmin = c[0]; if (c[0] > xmax) xmax = c[0]; if (c[1] < ymin) ymin = c[1]; if (c[1] > ymax) ymax = c[1]; }));
        f._id = pre + i; f._nom = nomDe(f); f._bb = [xmin, ymin, xmax, ymax]; f._polys = polys;
        return f;
      });
      fonds.pays = prep(pays, "p", f => PAYS_FR[f.properties.name] || (f.properties.name === "France" ? "France" : f.properties.name));
      fonds.regions = prep(regions, "r", f => f.properties.nom);
      fonds.deps = prep(deps, "d", f => f.properties.nom);
      fonds.france = fonds.pays.find(f => f.properties.name === "France") || null;
      fonds.deps.forEach(f => { fonds.depParNom[norm(f._nom)] = f; });
      fonds.regions.forEach(f => { fonds.regParNom[norm(f._nom)] = f; });
      return fonds;
    }

    async function chargerFonds() {
      if (fondsEtat) return;
      fondsEtat = "chargement";
      const [pays, regions, deps] = await Promise.all([chargerJson(URLS_GEO.pays), chargerJson(URLS_GEO.regions), chargerJson(URLS_GEO.deps)]);
      if (!pays) { fondsEtat = "erreur"; if ($("carteBloc")) majMarqueurs(false); return; }
      fondsGeo = preparerFonds(pays, regions, deps);
      fondsEtat = "ok"; zonesCache = {};
      if ($("carteBloc")) majMarqueurs(false);
    }

    function dansAnneau(pt, ring) {
      let c = false;
      for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
        const xi = ring[i][0], yi = ring[i][1], xj = ring[j][0], yj = ring[j][1];
        if ((yi > pt[1]) !== (yj > pt[1]) && pt[0] < (xj - xi) * (pt[1] - yi) / (yj - yi) + xi) c = !c;
      }
      return c;
    }
    const dansFeature = (pt, f) => pt[0] >= f._bb[0] && pt[0] <= f._bb[2] && pt[1] >= f._bb[1] && pt[1] <= f._bb[3] &&
      f._polys.some(po => dansAnneau(pt, po[0]) && !po.slice(1).some(h => dansAnneau(pt, h)));
    const quelleZone = (liste, pt) => liste.find(f => dansFeature(pt, f)) || null;

    // Région d'un département : on teste un point intérieur du département
    function regionDuDep(dep) {
      if (dep._reg !== undefined) return dep._reg;
      const b = dep._bb, essais = [[(b[0] + b[2]) / 2, (b[1] + b[3]) / 2]];
      const ring = dep._polys.reduce((m, po) => po[0].length > m.length ? po[0] : m, []);
      if (ring.length) {
        const mx = ring.reduce((a, c) => a + c[0], 0) / ring.length, my = ring.reduce((a, c) => a + c[1], 0) / ring.length;
        essais.push([mx, my], ring[0]);
      }
      dep._reg = null;
      for (const pt of essais) if (dansFeature(pt, dep)) { dep._reg = quelleZone(fondsGeo.regions, pt); if (dep._reg) break; }
      if (!dep._reg) for (const pt of essais) { dep._reg = quelleZone(fondsGeo.regions, pt); if (dep._reg) break; }
      return dep._reg;
    }

    // À quel pays / région / département appartient un lieu ? (coordonnées si connues, sinon lecture du texte pour la France)
    function zonesDe(lieu, k) {
      const c = geo[k], avecGeo = !!c, ca = zonesCache[k];
      if (ca && ca.avecGeo === avecGeo) return ca.z;
      const z = { pays: null, reg: null, dep: null };
      if (c) {
        const pt = [c[1], c[0]];
        z.pays = quelleZone(fondsGeo.pays, pt);
        if (z.pays && z.pays === fondsGeo.france) { z.dep = quelleZone(fondsGeo.deps, pt); z.reg = quelleZone(fondsGeo.regions, pt); }
      }
      if (!z.pays || z.pays === fondsGeo.france) {
        const parts = lieu.split(",").map(x => norm(x).trim()).filter(Boolean);
        if (parts.length > 1 && parts[parts.length - 1] === "france") {
          z.pays = z.pays || fondsGeo.france;
          for (let i = 1; i < parts.length - 1; i++) {
            if (!z.dep && fondsGeo.depParNom[parts[i]]) z.dep = fondsGeo.depParNom[parts[i]];
            if (!z.reg && fondsGeo.regParNom[parts[i]]) z.reg = fondsGeo.regParNom[parts[i]];
          }
        }
        if (z.dep && !z.reg) z.reg = regionDuDep(z.dep);
      }
      zonesCache[k] = { avecGeo: avecGeo, z: z };
      return z;
    }

    // Niveau d'affichage selon le zoom : pays, régions, départements, puis lieux précis
    const niveauCarte = () => { const zm = carteLeaflet.getZoom(); return zm <= 4 ? "pays" : zm <= 6 ? "region" : zm <= 9 ? "dep" : "lieu"; };
    const NOM_NIVEAU = { pays: "pays", region: "régions", dep: "départements" };

    function dessinerZones(lieux, niv) {
      const zones = {};
      let sans = 0;
      for (const k in lieux) {
        const g = lieux[k], z = zonesDe(g.nom, k);
        const f = niv === "pays" ? z.pays : (z.pays === fondsGeo.france ? (niv === "region" ? z.reg : z.dep) : z.pays);
        if (!f) { sans += g.ev.length; continue; }
        (zones[f._id] = zones[f._id] || { f: f, ev: [] }).ev.push.apply(zones[f._id].ev, g.ev);
      }
      for (const id in zones) {
        const zn = zones[id], n = zn.ev.length, st = { fillColor: couleurDensite(n), fillOpacity: 0.85, color: "#fff", weight: 1.4 };
        const couche = L.geoJSON(zn.f, { style: st });
        couche.on("mouseover", function () { couche.setStyle({ weight: 2.5, fillOpacity: 0.95 }); });
        couche.on("mouseout", function () { couche.setStyle(st); });
        couche.bindTooltip(echapper(zn.f._nom) + " (" + n + ")", { sticky: true })
          .bindPopup(popupLieu({ nom: zn.f._nom, ev: zn.ev }), { maxWidth: 320 }).addTo(coucheCarte);
      }
      return { sans: sans };
    }

    function majMarqueurs(recadrer) {
      if (!carteLeaflet) return;
      coucheCarte.clearLayers();
      const qui = idsQui(), pe = PERIODES[filtresCarte.periode];
      const ev = evenementsCarte().filter(e =>
        (filtresCarte.type === "tous" || e.type === filtresCarte.type) &&
        (!qui || qui.has(e.p.id)) &&
        (!pe || (e.an && e.an >= pe[0] && e.an <= pe[1])));
      const lieux = {};
      ev.forEach(e => { const k = cleLieu(e.lieu); (lieux[k] = lieux[k] || { nom: e.lieu, ev: [] }).ev.push(e); });
      const inconnus = [], introuvables = [], points = [];
      for (const k in lieux) {
        const g = lieux[k];
        if (!(k in geo)) { inconnus.push(g); continue; }
        if (!geo[k]) { introuvables.push(g.nom); continue; }
        points.push(geo[k]);
      }
      const niv = niveauCarte();
      const parZones = niv !== "lieu" && !!fondsGeo && (niv === "pays" || (fondsGeo.regions.length && fondsGeo.deps.length));
      let info = "";
      if (parZones) {
        const r = dessinerZones(lieux, niv);
        info = " · vue par " + NOM_NIVEAU[niv] + " (zoomez pour affiner)" + (r.sans ? " · " + r.sans + " événement(s) pas encore placé(s)" : "");
      } else {
        for (const k in lieux) {
          if (!geo[k]) continue;
          const g = lieux[k], n = g.ev.length;
          L.circleMarker(geo[k], { radius: Math.min(26, 8 + 3 * Math.sqrt(n)), color: "#fff", weight: 2, fillColor: couleurDensite(n), fillOpacity: 0.88 })
            .bindPopup(popupLieu(g), { maxWidth: 320 })
            .bindTooltip(echapper(g.nom) + " (" + n + ")")
            .addTo(coucheCarte);
        }
        if (niv !== "lieu" && fondsEtat === "erreur") info = " · frontières indisponibles (connexion ?), affichage par lieux";
        else if (niv !== "lieu" && fondsEtat !== "ok") info = " · chargement des frontières…";
      }
      if (recadrer && points.length) carteLeaflet.fitBounds(points, { padding: [40, 40], maxZoom: 8 });
      const enCours = inconnus.length && !geoBloque;
      $("statutCarte").textContent = (ev.length ? points.length + " lieu(x) localisé(s) · " + ev.length + " événement(s)" : "Aucun lieu renseigné pour ces filtres : ajoutez des lieux dans les fiches.") + info +
        (enCours ? " · localisation en cours, " + inconnus.length + " lieu(x) restant(s)…" : "") +
        (inconnus.length && geoBloque ? " · " + inconnus.length + " lieu(x) non localisé(s) (connexion internet nécessaire)" : "") +
        (introuvables.length ? " · introuvable(s) : " + introuvables.slice(0, 5).join(", ") + (introuvables.length > 5 ? "…" : "") + " (essayez « Ville, département »)" : "");
      if (enCours) {
        // d'abord les lieux dont on ne connaît pas la zone, puis les plus nombreux
        const prio = g => (fondsGeo && zonesDe(g.nom, cleLieu(g.nom)).pays) ? 1 : 0;
        inconnus.sort((x, y) => prio(x) - prio(y) || y.ev.length - x.ev.length);
        localiserLieux(inconnus.map(g => g.nom));
      }
    }

    async function localiserLieux(lieux) {
      if (geoEnCours) return;
      geoEnCours = true;
      let echec = false;
      for (const l of lieux) {
        if (!$("carteBloc")) break;   // on a quitté la carte
        try {
          const chercher = async q => {
            const rep = await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=fr&q=" + encodeURIComponent(q));
            if (!rep.ok) throw new Error("http");
            return rep.json();
          };
          let d = await chercher(l);
          const morceaux = l.split(",").map(x => x.trim()).filter(Boolean);
          if (!d[0] && morceaux.length > 2) {
            await new Promise(ok => setTimeout(ok, 1100));
            d = await chercher(morceaux[0] + ", " + morceaux[morceaux.length - 1]);
          }
          geo[cleLieu(l)] = d[0] ? [+d[0].lat, +d[0].lon] : null;
          try { localStorage.setItem(CLE_GEO, JSON.stringify(geo)); } catch (e) {}
          majMarqueurs(false);
        } catch (e) { echec = true; break; }
        await new Promise(ok => setTimeout(ok, 1100));   // politesse envers le service de localisation
      }
      geoEnCours = false;
      if (echec) geoBloque = true;
      if ($("carteBloc")) majMarqueurs(true);
    }

    function afficherCarte(zone) {
      if ($("page").hidden) return;
      if ($("carteBloc")) { majMarqueurs(false); return; }
      if (carteLeaflet) { carteLeaflet.remove(); carteLeaflet = null; }
      if (typeof L === "undefined") {
        zone.innerHTML = '<div class="vide">La carte a besoin d’internet (la bibliothèque Leaflet ne s’est pas chargée). Reconnectez-vous puis rechargez la page.</div>';
        return;
      }
      const opt = (v, t, cur) => '<option value="' + v + '"' + (v === cur ? " selected" : "") + ">" + t + "</option>";
      zone.innerHTML = '<div id="carteBloc"><div class="filtresCarte">' +
        '<select data-fc="qui" aria-label="Individus">' + opt("tous", "Tous les individus", filtresCarte.qui) +
          opt("asc", "Ascendants de la personne ouverte", filtresCarte.qui) + opt("desc", "Descendants de la personne ouverte", filtresCarte.qui) + "</select>" +
        '<select data-fc="type" aria-label="Événements">' + opt("tous", "Tous les événements", filtresCarte.type) + opt("Naissance", "Naissances", filtresCarte.type) +
          opt("Mariage", "Mariages", filtresCarte.type) + opt("Décès", "Décès", filtresCarte.type) + opt("Divorce", "Divorces", filtresCarte.type) + "</select>" +
        '<select data-fc="periode" aria-label="Périodes">' + opt("toutes", "Toutes les périodes", filtresCarte.periode) + opt("avant1800", "Avant 1800", filtresCarte.periode) +
          opt("p1800", "1800 - 1899", filtresCarte.periode) + opt("p1900", "1900 - 1949", filtresCarte.periode) + opt("p1950", "Depuis 1950", filtresCarte.periode) + "</select>" +
        '</div><div id="carteL"></div><p id="statutCarte" class="doux"></p></div>';
      carteLeaflet = L.map("carteL").setView([46.6, 2.4], 6);
      const fondClair = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}",
        { maxZoom: 18, maxNativeZoom: 16, attribution: "Tuiles © Esri" }).addTo(carteLeaflet);
      const fondEsri = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",
        { maxZoom: 18, attribution: "Tuiles © Esri" });
      const fondOsm = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
        { maxZoom: 19, attribution: "© les contributeurs d’OpenStreetMap", referrerPolicy: "origin" });
      const fondSat = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
        { maxZoom: 18, attribution: "Imagerie © Esri" });
      L.control.layers({ "Clair": fondClair, "Plan": fondEsri, "OpenStreetMap": fondOsm, "Satellite": fondSat }, null, { position: "topright" }).addTo(carteLeaflet);
      coucheCarte = L.layerGroup().addTo(carteLeaflet);
      const lg = L.control({ position: "bottomright" });
      lg.onAdd = function () {
        const d = L.DomUtil.create("div", "legendeCarte");
        d.innerHTML = SEUILS.map(x => '<div><i style="background:' + x[3] + '"></i>' + x[2] + "</div>").join("");
        return d;
      };
      lg.addTo(carteLeaflet);
      geoBloque = false;
      niveauCourant = niveauCarte();
      carteLeaflet.on("zoomend", function () {
        const n = niveauCarte();
        if (n !== niveauCourant) { niveauCourant = n; majMarqueurs(false); }
      });
      chargerFonds();
      majMarqueurs(true);
    }

    // ---------- La fiche (formulaire) ----------

    function remplirListes() {
      for (const k of ["pere", "mere", "conjoint"]) {
        const courant = $(k).value;
        const liste = personnes.filter(p =>
          p.id !== choix &&
          (k === "pere" ? p.sexe !== "F" : k === "mere" ? p.sexe !== "H" : true));
        $(k).innerHTML = '<option value="">—</option>' +
          liste.map(p => '<option value="' + p.id + '">' + echapper(nomComplet(p)) + "</option>").join("");
        $(k).value = courant;
      }
    }

    function afficherRelations() {
      const x = choix && trouver(choix);
      const div = $("relations");
      if (!x) { div.innerHTML = ""; div.hidden = true; return; }
      div.hidden = false;

      const boutons = [];
      if (!(x.pere && trouver(x.pere))) boutons.push(["pere", "+ Père"]);
      if (!(x.mere && trouver(x.mere))) boutons.push(["mere", "+ Mère"]);
      if (aDesParents(x)) boutons.push(["frere", "+ Frère / sœur"]);
      if (!(x.conjoint && trouver(x.conjoint))) boutons.push(["conjoint", "+ Conjoint(e)"]);
      boutons.push(["enfant", "+ Enfant"]);

      div.innerHTML = "<p>Ajouter un proche de " + echapper(x.prenom || "cette personne") + " :</p>" +
        boutons.map(b => '<button type="button" data-rel="' + b[0] + '">' + b[1] + "</button>").join("") +
        (aDesParents(x) ? "" : "<small>Ajoutez d’abord un parent pour pouvoir ajouter des frères et sœurs.</small>");
    }

    function majFiche() {
      if (ficheXL && onglet === "famille") onglet = "fiche";
      const p = choix && trouver(choix);
      const x = ajout && trouver(ajout.ref);
      const titres = {
        pere: "Nouveau père", mere: "Nouvelle mère",
        frere: "Nouveau frère ou nouvelle sœur", enfant: "Nouvel enfant",
        conjoint: "Nouveau conjoint ou nouvelle conjointe"
      };

      if (p) {
        $("titre").textContent = "Fiche de " + (p.prenom || nomComplet(p));
        $("aide").textContent = "Modifiez les champs puis cliquez sur Enregistrer.";
      } else if (x) {
        $("titre").textContent = titres[ajout.type] + " de " + x.prenom;
        $("aide").textContent = "Remplissez ce que vous savez, le reste pourra être complété plus tard.";
      } else if (!personnes.length) {
        $("titre").textContent = "Ma fiche";
        $("aide").textContent = "Commencez par vous : remplissez votre propre fiche.";
      } else {
        $("titre").textContent = "Nouvelle personne";
        $("aide").textContent = "";
      }

      $("ok").textContent = p ? "Enregistrer" : "Ajouter";
      $("supprimer").hidden = !p;
      $("supprimer").textContent = "Supprimer";
      confirmer = false;
      $("nouveau").hidden = !p;
      $("annuler").hidden = !x;
      afficherEntete();
      afficherRelations();
      afficherEvenements();
      afficherFamille();
      afficherDocs();
      afficherNotes();
      const vues = { fiche: "vueFiche", famille: "vueFamille", docs: "vueDocs", notes: "vueNotes" };
      for (const o in vues) $(vues[o]).hidden = !p || (o === "famille" ? !ficheXL && onglet !== "famille" : onglet !== o);
      $("vueModifier").hidden = !!p && onglet !== "modifier";
      $("onglets").hidden = !p;
      for (const b of document.querySelectorAll("#onglets button")) {
        b.classList.toggle("actif", b.dataset.o === onglet);
      }
      afficherArbre();
    }

    function ouvrir(id) {
      choix = id;
      dernier = id;
      ajout = null;
      remplirListes();
      const p = trouver(id);
      for (const k of CHAMPS) $(k).value = p[k] || "";
      $("militaire").open = !!(p.armee || p.unite || p.grade || p.periodeMilitaire || p.matricule);
      onglet = "fiche";
      majFiche();
      if (ficheXL) window.scrollTo(0, 0);
    }

    function nouvelle(relation) {
      if (relation) afficherFiche(true, false);
      choix = null;
      ajout = relation || null;
      $("formulaire").reset();
      $("militaire").open = false;
      remplirListes();

      const x = relation && trouver(relation.ref);
      if (x) {
        if (relation.type === "pere") { $("sexe").value = "H"; $("nom").value = x.nom || ""; }
        if (relation.type === "mere") { $("sexe").value = "F"; }
        if (relation.type === "frere") {
          $("pere").value = x.pere || "";
          $("mere").value = x.mere || "";
          $("nom").value = x.nom || "";
        }
        if (relation.type === "enfant") {
          if (x.sexe === "F") { $("mere").value = x.id; $("pere").value = x.conjoint || ""; }
          else { $("pere").value = x.id; $("mere").value = x.conjoint || ""; }
        }
        if (relation.type === "conjoint") { $("conjoint").value = x.id; }
      }
      onglet = "modifier";
      majFiche();
      $("prenom").focus();
    }

    // ---------- Enregistrement ----------

    function lierParents(q) {
      const a = q.pere && trouver(q.pere);
      const b = q.mere && trouver(q.mere);
      if (a && b && !a.conjoint && !b.conjoint) {
        a.conjoint = b.id;
        b.conjoint = a.id;
      }
    }

    $("formulaire").addEventListener("submit", function (e) {
      e.preventDefault();
      const prenom = $("prenom").value.trim();
      const nom = $("nom").value.trim();
      if (!prenom && !nom) { dire("Indiquez au moins un prénom ou un nom."); return; }

      let p = choix && trouver(choix);
      if (!p) {
        p = { id: nouvelId() };
        personnes.push(p);
      }
      const ancienConjoint = p.conjoint;

      for (const k of CHAMPS) {
        p[k] = $(k).value.trim();
      }
      p.maj = Date.now();

      // Le lien de conjoint va dans les deux sens
      if (ancienConjoint && ancienConjoint !== p.conjoint) {
        const o = trouver(ancienConjoint);
        if (o && o.conjoint === p.id) { o.conjoint = ""; o.mariage = ""; o.lieuMariage = ""; o.divorce = ""; o.lieuDivorce = ""; }
      }
      if (p.conjoint) {
        const o = trouver(p.conjoint);
        if (o.conjoint && o.conjoint !== p.id) {
          const autre = trouver(o.conjoint);
          if (autre && autre.conjoint === o.id) autre.conjoint = "";
        }
        o.conjoint = p.id;
        o.mariage = p.mariage;
        o.lieuMariage = p.lieuMariage;
        o.divorce = p.divorce;
        o.lieuDivorce = p.lieuDivorce;
      }

      // Un père et une mère communs forment un couple
      lierParents(p);

      // Si on ajoutait un père ou une mère, on le rattache à la personne de départ
      let retour = p.id;
      if (ajout) {
        const x = trouver(ajout.ref);
        if (x) {
          if (ajout.type === "pere") x.pere = p.id;
          if (ajout.type === "mere") x.mere = p.id;
          lierParents(x);
          retour = x.id;
        }
      }

      sauvegarder();
      const message = ajout ? "Ajouté : " + nomComplet(p) + "." : "Enregistré : " + nomComplet(p) + ".";
      ouvrir(retour);
      dire(message);
    });

    // ---------- Boutons ----------

    $("arbre").addEventListener("click", function (e) {

        const cw = this.clientWidth / 2, ch = this.clientHeight / 2;
        if (z.dataset.z === "+") zoomerAutour(cw, ch, 1.25);
        else if (z.dataset.z === "-") zoomerAutour(cw, ch, 0.8);
        else vueCentre(this, z.dataset.z === "tout");
        return;
      }
      const ph = e.target.closest("[data-ph]");
      if (ph) { ouvrir(ph.dataset.pour); nouvelle({ type: ph.dataset.ph, ref: ph.dataset.pour }); dire(""); return; }
      const cv = e.target.closest("[data-chev]");
      if (cv) { ouvrir(cv.dataset.chev); dire(""); return; }
      const c = e.target.closest(".carte, .sl");
      if (c) { ouvrir(c.dataset.id); dire(""); return; }
      const pa = e.target.closest("a[data-pid]");
      if (pa) { ouvrir(pa.dataset.pid); dire(""); }
    });

    $("relations").addEventListener("click", function (e) {

      if (t) { nouvelle({ type: t, ref: choix }); dire(""); }
    });

    $("nouveau").addEventListener("click", function () { nouvelle(null); dire(""); });

    $("annuler").addEventListener("click", function () {
      if (ajout) ouvrir(ajout.ref);
      dire("");

    $("supprimer").addEventListener("click", function () {
      if (!confirmer) {
        confirmer = true;
        $("supprimer").textContent = "Confirmer la suppression";
        return;
      }
      const id = choix;
      personnes = personnes.filter(p => p.id !== id);
      for (const p of personnes) {
        for (const k of ["pere", "mere", "conjoint"]) {
          if (p[k] === id) p[k] = "";
        }
      }
      sauvegarder();
      nouvelle(null);
      dire("Personne supprimée.");

    $("effacer").addEventListener("click", function () {
      if (confirm("Effacer tout l’arbre et repartir de zéro ?")) {
        personnes = [];
        sauvegarder();
        nouvelle(null);
        dire("");
      }
    });

    $("onglets").addEventListener("click", function (e) {
      const o = e.target.dataset.o;
      if (o) { onglet = o; majFiche(); }
    });

    $("vueFiche").addEventListener("click", function (e) {
      const bt = e.target.closest("button");
      if (bt && bt.dataset.menuev) {
        const m = bt.nextElementSibling, etaitOuvert = !m.hidden;

      const o = e.target.dataset.ouvrir;
      if (o) {
        const doc = (trouver(choix).docs || []).find(x => x.id === o);
        if (doc) window.open(URL.createObjectURL(versBlob(doc.data)), "_blank");
        return;
      }
      const a = e.target.closest("[data-id]");
      if (a) ouvrir(a.dataset.id);

    $("vueFamille").addEventListener("click", function (e) {
      const a = e.target.closest("[data-id]");
      if (a) ouvrir(a.dataset.id);
    });

    $("entete").addEventListener("change", function (e) {
      if (e.target.id === "etiqSel" && e.target.value) {
        const p = trouver(choix);
        p.etiquettes = (p.etiquettes || []).concat([e.target.value]);
        sauvegarder();
        majFiche();
      }
    });

    $("entete").addEventListener("click", function (e) {
      const i = e.target.dataset.tag;
      if (i !== undefined) {
        trouver(choix).etiquettes.splice(+i, 1);
        sauvegarder();
        majFiche();
      }
    });

    $("vueDocs").addEventListener("change", async function (e) {
      if (e.target.id === "catDoc") { catDoc = e.target.value; return; }
      if (e.target.dataset.cat) {
        const q = trouver(choix);
        const doc = q && (q.docs || []).find(x => x.id === e.target.dataset.cat);
        if (doc) { doc.categorie = e.target.value; sauvegarder(); majFiche(); }
        return;
      }
      if (e.target.id !== "fichier") return;
      const p = trouver(choix);
      if (!p) return;
      await ajouterFichiers(p, Array.from(e.target.files), catDoc);

    $("vueDocs").addEventListener("click", function (e) {
      const p = trouver(choix);
      if (!p) return;
      const t = e.target.dataset, docs = p.docs || [];
      if (t.ouvrir) {
        const d = docs.find(x => x.id === t.ouvrir);

      if (t.suppr && confirm("Supprimer ce document ?")) {
        p.docs = docs.filter(x => x.id !== t.suppr);

        sauvegarder();
        majFiche();
      }
    });

    $("vueNotes").addEventListener("click", function (e) {
      const p = trouver(choix);
      if (!p) return;
      if (e.target.id === "ajoutNote") {
        const texte = $("texteNote").value.trim();
        if (!texte) return;
        p.notes = (p.notes || []).concat([{ id: nouvelId(), texte: texte, date: new Date().toLocaleDateString("fr-FR") }]);

        majFiche();

        majFiche();

    // ----- Photos ajoutées depuis un événement de la frise -----
    $("fichierEv").addEventListener("change", async function (e) {

    // ----- Barre du haut : arbres et recherche -----
    function actionArbre(e) {
      const b = e.target.closest("button[data-a]");
      if (!b) return;
      const a = b.dataset.a, id = b.dataset.i, dlg = $("dlgArbres");

      if (a === "ouvrir") { changerArbre(id); aller("arbre"); if (dlg.open) dlg.close(); }
      else if (a === "tous") { listeArbres(); dlg.showModal(); }
      else if (a === "creer") { if (dlg.open) dlg.close(); creerArbre(); }
      else if (a === "renommer") renommerArbre(id);
      else if (a === "exporter") exporterArbre(id);
      else if (a === "supprimer") supprimerArbre(id);
      else if (a === "importer") $("impArbre").click();
      else if (a === "importerGed") { if (dlg.open) dlg.close(); $("impGed").click(); }

    $("menuArbres").addEventListener("click", actionArbre);
    $("dlgArbres").addEventListener("click", actionArbre);
    $("btnArbres").addEventListener("click", function () {
      menuArbres();
      $("menuArbres").hidden = !$("menuArbres").hidden;
    });
    $("renommerArbre").addEventListener("click", function () { renommerArbre(base.courant); });
    $("impArbre").addEventListener("change", function (e) {

      e.target.value = "";

      if (e.target.files.length) importerGedcoms(Array.from(e.target.files));
      e.target.value = "";
    });
    // Glisser-déposer un ou plusieurs fichiers .ged n'importe où sur la page

    window.addEventListener("drop", function (e) {
      e.preventDefault();
      const f = Array.from(e.dataTransfer.files).filter(x => /\.(ged|gedcom)$/i.test(x.name));
      if (f.length) importerGedcoms(f);
    });

    $("rech").addEventListener("input", function () {
      const q = this.value.trim().toLowerCase(), z = $("resRech");
      if (!q) { z.hidden = true; return; }
      const l = personnes.filter(p => nomComplet(p).toLowerCase().includes(q)).slice(0, 8);
      z.innerHTML = l.length
        ? l.map(p => '<button type="button" data-id="' + p.id + '">' + echapper(nomComplet(p)) + " <small>" + echapper(annees(p)) + "</small></button>").join("")
        : "<p>Aucun résultat dans cet arbre.</p>";
      z.hidden = false;
    });
    $("resRech").addEventListener("click", function (e) {
      const b = e.target.closest("[data-id]");
      if (b) { ouvrir(b.dataset.id); this.hidden = true; $("rech").value = ""; }
    });

    $("formats").addEventListener("click", function (e) {
      if (e.target.dataset.xl) { basculerXL(true); return; }
      const v = e.target.dataset.v;
      if (!v) return;
      if (v === "imprimer") { window.print(); return; }
      if (ficheXL) basculerXL(false, true);
      vue = v;
      base.vue = v;
      sauvegarderBase();
      afficherArbre();
    });

    document.addEventListener("click", function (e) {
      if (!e.target.closest(".evAct")) fermerMenus();
      if (!e.target.closest("#haut .menu")) $("menuArbres").hidden = true;
      if (!e.target.closest(".recherche")) $("resRech").hidden = true;
    });

    // ----- Accueil -----
    $("formRech").addEventListener("submit", function (e) {
      e.preventDefault();
      const nom = norm($("rNom").value.trim()), pre = norm($("rPrenom").value.trim()), lieu = norm($("rLieu").value.trim());
      const z = $("resultats");
      if (!nom && !pre && !lieu) { z.innerHTML = '<p class="doux">Saisissez au moins un nom, un prénom ou un lieu.</p>'; return; }
      const res = [];
      for (const a of base.arbres) for (const p of a.personnes) {
        if (nom && !norm(p.nom).includes(nom)) continue;
        if (pre && !norm(p.prenom).includes(pre)) continue;
        if (lieu && ![p.lieuNaissance, p.lieuDeces, p.lieuMariage, p.lieuDivorce].some(l => norm(l).includes(lieu))) continue;
        res.push({ p: p, a: a });
      }
      z.innerHTML = res.length
        ? '<p class="doux">' + res.length + " résultat(s)</p><div class=\"grilleRes\">" + res.slice(0, 40).map(x =>
            ligneP(x.p, x.a.id, [annees(x.p), x.p.lieuNaissance, base.arbres.length > 1 ? "Arbre : " + x.a.nom : ""].filter(Boolean).join(" · "))).join("") + "</div>"
        : '<p class="doux">Aucune personne trouvée.</p>';
    });

    $("accueil").addEventListener("click", function (e) {
      const b = e.target.closest("button");
      if (!b) return;
      const d = b.dataset;
      if (b.classList.contains("carte")) { ouvrirPersonne(base.courant, d.id); return; }
      if (d.open) { ouvrirPersonne(d.arbre, d.open, d.photo ? "docs" : null); return; }
      if (d.go) aller("arbre");
      else if (d.nouveau) { nouvelle(null); aller("arbre", { formulaire: true }); }
      else if (d.liste) { vue = "liste"; base.vue = "liste"; sauvegarderBase(); aller("arbre"); }
      else if (d.creer) creerArbre();
      else if (d.importged) $("impGed").click();
      else if (d.arbreouvrir) { changerArbre(d.arbreouvrir); aller("arbre"); }
      else if (d.scroll) $("carrousel").scrollBy({ left: 300 * +d.scroll, behavior: "smooth" });
    });

    $("logo").addEventListener("click", function () { aller("accueil"); });
    $("btnAccueil").addEventListener("click", function () { aller("accueil"); });

    // ----- Filtres de la carte -----
    $("arbre").addEventListener("change", function (e) {
      const k = e.target.dataset.fc;
      if (!k) return;
      filtresCarte[k] = e.target.value;
      geoBloque = false;
      majMarqueurs(true);
    });

    // ----- Fiche repliable + recadrage selon la taille de l'écran -----
    const CLE_FICHE = "fiche-repliee";
    function afficherFiche(oui, recadrer) {
      $("page").classList.toggle("ficheOff", !oui);
      $("btnFiche").textContent = oui ? "Masquer la fiche ▸" : "◂ Afficher la fiche";
      $("btnFiche").setAttribute("aria-expanded", String(oui));
      try { localStorage.setItem(CLE_FICHE, oui ? "0" : "1"); } catch (e) {}
      if (recadrer !== false) setTimeout(function () {
        if (pageCourante === "arbre" && $("monde")) vueCentre($("arbre"), true);
        if (carteLeaflet) carteLeaflet.invalidateSize();
      }, 120);
    }
    $("btnFiche").addEventListener("click", function () { afficherFiche($("page").classList.contains("ficheOff")); });
    $("fermerFiche").addEventListener("click", function () { afficherFiche(false); });
    let minuteurRedim = null;
    function recadrerVue() {
      clearTimeout(minuteurRedim);
      minuteurRedim = setTimeout(function () {
        if (pageCourante !== "arbre") return;
        if ($("monde")) vueCentre($("arbre"), false);
        if (carteLeaflet) carteLeaflet.invalidateSize();
      }, 90);
    }
    window.addEventListener("resize", recadrerVue);
    if (window.ResizeObserver) new ResizeObserver(recadrerVue).observe($("zoneArbre"));
    try { if (localStorage.getItem(CLE_FICHE) === "1") afficherFiche(false, false); } catch (e) {}

    // ----- Fiche en grand (façon Filae) -----
    function basculerXL(oui, silencieux) {
      ficheXL = oui;
      $("page").classList.toggle("ficheXL", oui);
      try { localStorage.setItem("fiche-xl", oui ? "1" : "0"); } catch (e) {}
      if (oui) { afficherFiche(true, false); if (onglet === "famille") onglet = "fiche"; }
      if (silencieux) return;
      if (oui && !choix && !ajout && personnes.length) ouvrir(dernier || personnes[0].id); else majFiche();
      window.scrollTo(0, 0);
      if (!oui) setTimeout(function () { if (carteLeaflet) carteLeaflet.invalidateSize(); }, 80);
    }
    $("agrandirFiche").addEventListener("click", function () { basculerXL(true); });
    $("actionsXL").addEventListener("click", function (e) {
      const a = e.target.dataset.act;
      if (a === "arbre") basculerXL(false);
      else if (a === "modifier") { onglet = "modifier"; majFiche(); }
    });
    try { if (localStorage.getItem("fiche-xl") === "1") { ficheXL = true; $("page").classList.add("ficheXL"); } } catch (e) {}

    aller("accueil");
    nouvelle(null);
  </script>
  <script>
    // ===== Sauvegarde cloud (Supabase) — facultative =====
    // URL et clé publishable (publique) de ton projet Supabase.
    // La clé anon est publique par conception : la sécurité vient des règles RLS (voir supabase.sql).
    (function () {
      const SUPABASE_URL = "https://tivocfxqlfqgwaxozzyo.supabase.co";
      const SUPABASE_KEY = "sb_publishable_O04GGmPmay9DylTpFLfmjw_Y4_tR2cL";
      const bouton = document.getElementById("btnCloud");
      if (!window.supabase || SUPABASE_URL.indexOf("COLLE") === 0) { bouton.hidden = true; return; }

      const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      const dlg = document.getElementById("dlgCloud"), corps = document.getElementById("cloudCorps");
      let user = null, minuteur = null, dejaSynchro = null;

      const nbPers = b => (b && b.arbres ? b.arbres.reduce((n, a) => n + (a.personnes || []).length, 0) : 0);
      const msg = t => { const m = document.getElementById("cloudMsg"); if (m) m.textContent = t; };
      const etat = t => { bouton.textContent = t; };

      async function pousser() {
        if (!user) return;
        etat("☁ Envoi…");
        const r = await sb.from("arbres").upsert({ user_id: user.id, data: base, updated_at: new Date().toISOString() });
        etat(r.error ? "☁ Erreur" : "☁ Synchronisé");
        if (r.error) console.error(r.error);
        msg(r.error ? "Erreur : " + r.error.message : "Sauvegardé ✔");
      }

      window.cloudPlanifier = function () {
        if (!user) return;
        etat("☁ …");
        clearTimeout(minuteur);
        minuteur = setTimeout(pousser, 1500);
      };

      async function synchroniser() {
        etat("☁ Synchro…");
        const r = await sb.from("arbres").select("data").eq("user_id", user.id).maybeSingle();
        if (r.error) { etat("☁ Erreur"); console.error(r.error); return; }
        const cloud = r.data && r.data.data;
        if (cloud) {
          const plusRecent = (cloud.sync || 0) > (base.sync || 0);
          const localVide = nbPers(base) === 0 && nbPers(cloud) > 0;
          if (localVide || (plusRecent && confirm(
              "Une version plus récente de tes arbres existe dans le cloud.\n\nOK = charger la version du cloud (remplace cet appareil)\nAnnuler = garder cet appareil (écrase le cloud)"))) {
            localStorage.setItem(CLE3, JSON.stringify(cloud));
            location.reload();
            return;
          }
        }
        await pousser();
      }

      function rendre() {
        if (user) {
          corps.innerHTML = '<p>Connecté : <b></b></p>' +
            '<button type="button" class="action" id="cSave">Sauvegarder maintenant</button>' +
            '<button type="button" class="action clair" id="cOut">Se déconnecter</button>' +
            '<p id="cloudMsg"></p>';
          corps.querySelector("b").textContent = user.email;
          document.getElementById("cSave").onclick = pousser;
          document.getElementById("cOut").onclick = async function () { await sb.auth.signOut(); dlg.close(); };
        } else {
          corps.innerHTML = '<p class="doux">Connecte-toi pour retrouver tes arbres sur tous tes appareils.</p>' +
            '<label for="cMail">E-mail</label><input id="cMail" type="email" autocomplete="email">' +
            '<label for="cPass">Mot de passe (6 caractères min.)</label><input id="cPass" type="password" autocomplete="current-password">' +
            '<button type="button" class="action" id="cIn">Se connecter</button>' +
            '<button type="button" class="action clair" id="cNew">Créer un compte</button>' +
            '<p id="cloudMsg"></p>';
          const go = async function (creer) {
            const email = document.getElementById("cMail").value.trim(), password = document.getElementById("cPass").value;
            if (!email || !password) { msg("Renseigne l'e-mail et le mot de passe."); return; }
            msg("…");
            const r = creer ? await sb.auth.signUp({ email: email, password: password })
                            : await sb.auth.signInWithPassword({ email: email, password: password });
            if (r.error) { msg(r.error.message); return; }
            if (creer && !r.data.session) msg("Compte créé. Confirme ton e-mail, puis reviens te connecter.");
            else dlg.close();
          };
          document.getElementById("cIn").onclick = function () { go(false); };
          document.getElementById("cNew").onclick = function () { go(true); };
        }
      }

      bouton.addEventListener("click", function () { rendre(); dlg.showModal(); });
      document.getElementById("cloudFermer").addEventListener("click", function () { dlg.close(); });

      sb.auth.onAuthStateChange(function (evt, session) {
        user = session ? session.user : null;
        if (!user) { dejaSynchro = null; etat("☁ Connexion"); return; }
        etat("☁ " + (user.email || "Connecté").split("@")[0]);
        if (dejaSynchro !== user.id) { dejaSynchro = user.id; setTimeout(synchroniser, 0); }
      });
    })();
  </script>
