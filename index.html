<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mon arbre généalogique</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <style>
    :root {
      --corail: #fbd9d3; --indigo: #6c58b8; --violet: #7b66c6; --or: #f2b84b;
      --h: #4b8fc7; --f: #d4628f; --trait: #d8cdf0;
      --texte: #3a3350; --doux: #7a7490; --fond: #fdf6f3;
    }
    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: var(--fond); color: var(--texte);
           font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }
    #page { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 20px;
            padding: 20px; align-items: start; }
    @media (max-width: 900px) { #page { grid-template-columns: 1fr; padding: 12px; } }
    :focus-visible { outline: 3px solid var(--violet); outline-offset: 2px; }

    /* ----- Arbre ----- */
    #arbre { background: #fff; border-radius: 14px; padding: 28px 12px;
             min-height: 300px; overflow-x: auto; text-align: center; }
    .vide { color: var(--doux); padding: 70px 20px; }
    #arbre ul { display: flex; justify-content: center; list-style: none;
                margin: 0; padding: 22px 0 0 0; position: relative; }
    #arbre > ul { padding-top: 0; }
    #arbre li { position: relative; padding: 22px 8px 0 8px; display: flex;
                flex-direction: column; align-items: center; }
    #arbre > ul > li { padding-top: 0; }
    #arbre li::before, #arbre li::after { content: ""; position: absolute; top: 0;
      right: 50%; width: 50%; height: 22px; border-top: 2px solid var(--trait); }
    #arbre li::after { right: auto; left: 50%; border-left: 2px solid var(--trait); }
    #arbre > ul > li::before, #arbre > ul > li::after,
    #arbre li:only-child::before, #arbre li:only-child::after { display: none; }
    #arbre li:only-child { padding-top: 22px; }
    #arbre li:first-child::before, #arbre li:last-child::after { border: 0; }
    #arbre li:last-child::before { border-right: 2px solid var(--trait); border-radius: 0 8px 0 0; }
    #arbre li:first-child::after { border-radius: 8px 0 0 0; }
    #arbre ul ul::before { content: ""; position: absolute; top: 0; left: 50%;
                           height: 22px; border-left: 2px solid var(--trait); }

    .couple { display: flex; align-items: flex-start; }
    .lien { display: flex; flex-direction: column; align-items: center; min-width: 60px;
            max-width: 100px; margin-top: 30px; font-size: 10px; line-height: 1.3;
            color: var(--doux); text-align: center; }
    .lien .trait { width: 100%; border-top: 2px dotted #cdbfee; position: relative; margin-bottom: 6px; }
    .lien .trait::after { content: ""; position: absolute; left: 50%; top: -5px; width: 8px;
                          height: 8px; border-radius: 50%; background: #8d77d4; transform: translateX(-50%); }
    .lien .div { color: #d0556a; font-weight: 700; }

    .carte { font: inherit; color: inherit; background: #fff; border: 1px solid #e8e0f4;
             border-radius: 10px; width: 120px; padding: 10px 8px 8px; text-align: center;
             cursor: pointer; box-shadow: 0 1px 4px rgba(40, 40, 90, .10); }
    .carte:hover { border-color: var(--violet); }
    .carte .pn { display: block; margin-top: 6px; font-size: 12px; line-height: 1.25; }
    .carte .pn b { display: block; }
    .carte small { display: block; min-height: 14px; margin-top: 2px; font-size: 11px; color: var(--doux); }
    .carte.on { background: var(--indigo); border-color: var(--indigo); color: #fff; }
    .carte.on small { color: #e5dcf7; }
    .carte.ref { border-style: dashed; opacity: .8; }

    .av { display: inline-flex; align-items: center; justify-content: center; width: 48px;
          height: 48px; border-radius: 50%; color: #fff; font-weight: 700; font-size: 17px; }
    .av.h { background: var(--h); }
    .av.f { background: var(--f); }

    /* ----- Fiche ----- */
    #fiche { background: #fff; border-radius: 14px; overflow: hidden; }
    #entete { background: var(--indigo); color: #fff; padding: 18px 20px; display: flex;
              gap: 14px; align-items: center; }
    #entete .av { width: 62px; height: 62px; font-size: 22px; flex: none; }
    #entete h2 { margin: 0 0 2px; font-size: 20px; }
    #entete p { margin: 1px 0 0; font-size: 14px; color: #e5dcf7; }
    #relations { padding: 14px 20px 0; }
    #relations p { margin: 0 0 8px; font-size: 13px; font-weight: 600; color: var(--doux); }
    #relations small { display: block; color: var(--doux); }
    #relations button { font: inherit; font-size: 13px; margin: 0 6px 6px 0; padding: 5px 11px;
      background: #fff; color: var(--violet); border: 1.5px solid var(--violet);
      border-radius: 16px; cursor: pointer; }
    #onglets { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 20px 0; }
    #onglets button { font: inherit; font-weight: 600; padding: 7px 16px; background: #fff;
      color: var(--violet); border: 1.5px solid #cfc3ea; border-radius: 8px; cursor: pointer; }
    #onglets button.actif { background: #ede6fa; }
    #vueFiche, #vueFamille, #vueDocs, #vueNotes, #vueModifier { padding: 16px 20px 6px; }
    .doux { color: var(--doux); font-size: 14px; }

    .ev { display: grid; grid-template-columns: 56px 22px 1fr; gap: 0 6px; padding-bottom: 14px; }
    .ev .an { text-align: right; font-weight: 700; }
    .ev .an small { display: block; font-weight: 400; color: var(--doux); font-size: 12px; }
    .ev .pt { position: relative; }
    .ev .pt::before { content: ""; position: absolute; left: 50%; top: 4px; width: 14px; height: 14px;
      border-radius: 50%; border: 2px solid var(--or); background: #fff; transform: translateX(-50%); }
    .ev .pt::after { content: ""; position: absolute; left: 50%; top: 20px; bottom: -14px;
      border-left: 2px solid var(--or); transform: translateX(-50%); }
    .ev:last-child .pt::after { display: none; }
    .ev.fort .pt::before { background: var(--or); }
    .ev .corps { background: var(--fond); border-radius: 10px; padding: 8px 12px; }
    .ev .corps b { display: block; margin-bottom: 2px; }
    .ev .corps span { display: block; font-size: 14px; color: var(--doux); }
    .ev a, #relations a { color: var(--violet); cursor: pointer; font-weight: 600; }

    #vueModifier h2 { margin: 0 0 4px; font-size: 20px; color: var(--indigo); }
    #aide, #msg { color: var(--doux); font-size: 14px; margin: 4px 0; }
    #msg { padding: 0 20px; }
    #fiche label { display: block; font-weight: 600; font-size: 13px; margin-top: 10px; }
    #fiche input, #fiche select { width: 100%; font: inherit; font-size: 15px; padding: 7px 9px;
      border: 1px solid #ddd5ee; border-radius: 8px; background: #fcfaff; }
    .deux { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .groupe { border-top: 1px solid #ece6f3; margin-top: 16px; padding-top: 4px; }
    .groupe h3, details.groupe summary { margin: 8px 0 0; font-size: 14px; color: var(--indigo); cursor: pointer; }
    .groupe h3 { cursor: default; }
    button.action { font: inherit; font-weight: 600; padding: 8px 16px; margin: 16px 8px 8px 0;
      background: var(--violet); color: #fff; border: 1.5px solid var(--violet); border-radius: 8px; cursor: pointer; }
    button.action.clair { background: #fff; color: var(--violet); }
    button.action.danger { background: #fff; color: #d0556a; border-color: #d0556a; }
    #effacer { font: inherit; font-size: 13px; margin: 8px 20px 18px; padding: 4px 10px;
      background: #fff; color: #d0556a; border: 1px solid #d0556a; border-radius: 8px; cursor: pointer; }

    img.av { object-fit: cover; background: #ece6f3; }
    .badge { display: inline-block; background: rgba(255,255,255,.16); border-radius: 6px;
             padding: 2px 8px; font-size: 12px; margin: 8px 6px 0 0; }
    .badge a { cursor: pointer; margin-left: 4px; }
    #etiqSel { margin-top: 8px; font: inherit; font-size: 12px; padding: 2px 6px; border-radius: 6px;
               border: 0; background: rgba(255,255,255,.9); color: var(--indigo); }
    #vueFamille h3 { margin: 12px 0 6px; font-size: 14px; color: var(--violet); }
    .mini { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; font: inherit;
            background: var(--fond); border: 0; border-radius: 10px; padding: 8px 10px; margin-bottom: 6px; cursor: pointer; }
    .mini b { display: block; font-size: 14px; }
    .mini small { color: var(--doux); }
    .mini .av { width: 38px; height: 38px; font-size: 14px; flex: none; }
    .envoi { display: inline-block; padding: 8px 14px; border: 1.5px dashed var(--violet); border-radius: 18px;
             color: var(--violet); cursor: pointer; font-weight: 600; margin-bottom: 12px; }
    .galerie { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .doc { background: var(--fond); border-radius: 10px; padding: 8px; font-size: 13px; }
    .doc img, .doc .pdf { width: 100%; height: 110px; border-radius: 6px; }
    .doc img { object-fit: cover; cursor: pointer; }
    .doc .pdf { border: 0; background: #ede6fa; color: var(--violet); font-weight: 700; cursor: pointer; }
    .doc span { display: block; margin: 4px 0; word-break: break-word; }
    .outils a { margin-right: 10px; color: var(--violet); cursor: pointer; font-size: 12px; }
    #vueNotes textarea { width: 100%; height: 90px; font: inherit; padding: 8px; border: 1px solid #ddd5ee; border-radius: 8px; }
    .note { background: var(--fond); border-radius: 10px; padding: 8px 12px; margin-top: 10px; white-space: pre-wrap; font-size: 14px; }
    .note small { display: block; color: var(--doux); white-space: normal; margin-bottom: 2px; }
    .note a { cursor: pointer; color: var(--violet); }
    .cat { display: block; font-size: 13px; font-weight: 600; margin-bottom: 10px; }
    .doc select { font-size: 12px; padding: 3px 6px; margin-top: 2px; }
    .vignettes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .vignettes img, .vignettes .pdf { width: 64px; height: 64px; border-radius: 6px; cursor: pointer; }
    .vignettes img { object-fit: cover; }
    .vignettes .pdf { border: 0; background: #ede6fa; color: var(--violet); font-weight: 700; }

    /* ===== Palette joyeuse : pêche, lavande et jaune soleil ===== */
    body { font-family: "Lato", "Segoe UI", system-ui, sans-serif; }
    #haut { background: var(--corail); color: #fff; display: flex; align-items: center; gap: 14px;
            padding: 0 24px; height: 56px; position: relative; z-index: 20; }
    #haut h1 { margin: 0 14px 0 0; font-size: 23px; font-weight: 900; letter-spacing: -.3px; }
    #haut .menu, #haut .recherche { position: relative; }
    #haut .recherche { margin-left: auto; }
    #haut .menu > button { font: inherit; font-weight: 700; color: #fff; background: transparent; border: 0;
                           padding: 8px 12px; border-radius: 8px; cursor: pointer; }
    #haut .menu > button:hover { background: rgba(255,255,255,.18); }
    #rech { font: inherit; font-size: 14px; width: 260px; max-width: 42vw; padding: 8px 14px; border: 0;
            border-radius: 20px; background: #fff; color: var(--texte); }
    #menuArbres, #resRech { position: absolute; top: 100%; left: 0; margin-top: 6px; min-width: 270px;
      background: #fff; color: var(--texte); border-radius: 10px; padding: 6px 0;
      box-shadow: 0 6px 24px rgba(60, 40, 110, .20); }
    #resRech { left: auto; right: 0; }
    #menuArbres button, #resRech button { display: block; width: 100%; text-align: left; font: inherit;
      font-size: 15px; padding: 9px 18px; background: none; border: 0; cursor: pointer; color: var(--texte); }
    #menuArbres button:hover, #resRech button:hover { background: #f6f1fb; }
    #menuArbres button.cur { font-weight: 700; color: var(--violet); }
    #menuArbres .titreMenu, #resRech p { margin: 4px 18px; font-size: 14px; font-weight: 700; color: var(--doux); }
    #menuArbres hr { border: 0; border-top: 1px solid #ece6f3; margin: 6px 0; }
    #resRech small { color: var(--doux); margin-left: 6px; }

    #zoneArbre { background: #fff; border-radius: 16px; overflow: hidden; min-width: 0; }
    #zoneArbre .tete { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 20px 24px 6px; }
    #nomArbre { margin: 0; font-size: 27px; font-weight: 700; color: var(--violet); }
    #majArbre { margin: 2px 0 0; font-size: 14px; color: var(--doux); }
    .lien-btn { font: inherit; font-size: 14px; color: var(--violet); background: none; border: 0; cursor: pointer; text-decoration: underline; }
    #formats { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px 18px 10px; border-bottom: 1px solid #ece6f3; }
    #formats button { font: inherit; font-size: 14px; font-weight: 700; color: var(--violet); background: none;
                      border: 0; padding: 8px 14px; border-radius: 8px; cursor: pointer; }
    #formats button:hover { background: #f6f1fb; }
    #formats button.actif { background: #ede6fa; }
    #formats .droite { margin-left: auto; }
    #arbre { background: transparent; border-radius: 0; padding: 18px 12px; min-height: 340px; overflow: auto; }

    .carte { width: 112px; border-color: #e3daf2; border-radius: 8px; box-shadow: none; }
    .carte:hover { border-color: var(--violet); box-shadow: 0 2px 8px rgba(123, 102, 198, .20); }

    .entetevue { margin: 0 0 14px; font-weight: 700; color: var(--indigo); }
    .asc { display: inline-block; text-align: left; }
    .anc { display: flex; align-items: center; position: relative; }
    .anc > .parents { display: flex; flex-direction: column; margin-left: 26px; position: relative; }
    .anc > .parents::before { content: ""; position: absolute; left: -26px; top: 50%; width: 13px; border-top: 2px solid var(--trait); }
    .parents > .anc { padding: 5px 0; }
    .parents > .anc::before { content: ""; position: absolute; left: -13px; top: 50%; width: 13px; border-top: 2px solid var(--trait); }
    .parents > .anc::after { content: ""; position: absolute; left: -13px; top: 0; bottom: 0; border-left: 2px solid var(--trait); }
    .parents > .anc:first-child::after { top: 50%; }
    .parents > .anc:last-child::after { bottom: 50%; }
    .parents > .anc:only-child::after { display: none; }

    .roue { display: block; width: 100%; max-width: 940px; height: auto; margin: 0 auto; }
    .roue text { text-anchor: middle; pointer-events: none; font-family: inherit; fill: var(--texte); }
    .roue .sl { cursor: pointer; }
    .roue .sl:hover path { stroke: var(--violet); stroke-width: 2.5; }

    table.liste { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
    table.liste th { color: var(--doux); font-weight: 700; padding: 8px 12px; border-bottom: 2px solid #ece6f3; }
    table.liste td { padding: 9px 12px; border-bottom: 1px solid #f1ecf7; }
    table.liste tr.sl { cursor: pointer; }
    table.liste tr.sl:hover td { background: #f8f4fc; }
    table.liste tr.on td { background: #ede6fa; }

    #onglets button { border-color: #d6cbee; }
    #onglets button.actif { background: #fff; border-color: var(--or); border-width: 2px; }
    #entete { background: var(--indigo); }
    .ev .corps { background: #f6f1fb; position: relative; }
    .ev .corps b { padding-right: 34px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .chip { font: inherit; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 6px; border: 0; }
    .chip.doc { background: #e5dcf7; color: var(--indigo); }
    .chip.plus { background: #fff3d1; color: #8a6210; border: 1px dashed var(--or); cursor: pointer; }
    .chip.plus:hover { background: #ffe8a8; }
    .evAct { position: absolute; top: 6px; right: 8px; }
    .crayon { font: inherit; font-size: 17px; line-height: 1; color: var(--violet); background: none; border: 0; padding: 4px 6px; cursor: pointer; border-radius: 6px; }
    .crayon:hover { background: #e6ddf7; }
    .menuEv { position: absolute; right: 0; top: 100%; min-width: 210px; z-index: 5; background: #fff; border-radius: 10px;
              padding: 6px 0; box-shadow: 0 6px 22px rgba(60, 40, 110, .20); }
    .menuEv button { display: block; width: 100%; text-align: left; font: inherit; font-size: 14px; padding: 9px 16px;
                     background: none; border: 0; cursor: pointer; color: var(--texte); }
    .menuEv button:hover { background: #f6f1fb; }

    dialog#dlgArbres { border: 0; border-radius: 16px; padding: 0; width: min(620px, 94vw); box-shadow: 0 10px 40px rgba(60, 40, 110, .30); }
    dialog#dlgArbres::backdrop { background: rgba(60, 40, 110, .40); }
    .dlgTete { display: flex; justify-content: space-between; align-items: center; padding: 16px 22px; background: var(--corail); color: #fff; }
    .dlgTete h2 { margin: 0; font-size: 20px; }
    .dlgTete button { font: inherit; color: #fff; background: none; border: 0; font-size: 18px; cursor: pointer; }
    .ligneArbre { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 22px; border-bottom: 1px solid #ece6f3; }
    .ligneArbre.cur { background: #f6f1fb; }
    .ligneArbre small { display: block; color: var(--doux); }
    .ligneArbre .act { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
    .ligneArbre .act button { font: inherit; font-size: 13px; padding: 4px 10px; color: var(--violet); background: #fff;
                              border: 1.5px solid var(--violet); border-radius: 14px; cursor: pointer; }
    .ligneArbre .act button.danger { color: #d0556a; border-color: #d0556a; }
    .dlgPied { padding: 6px 22px 14px; }

    @media print {
      #haut, #fiche, #formats, #outils, .zoomCtl, .aideDrag, .lien-btn { display: none !important; }
      #arbre.pedigree { height: 90vh; }
      #page { display: block; padding: 0; }
      #zoneArbre { border-radius: 0; }
    }

    /* ===== Page d'accueil ===== */
    #logo { font: inherit; font-weight: 900; color: #fff; background: none; border: 0; padding: 0; cursor: pointer; letter-spacing: -.3px; }
    #haut .navBtn { font: inherit; font-weight: 700; color: #fff; background: transparent; border: 0;
                    padding: 8px 12px; border-radius: 8px; cursor: pointer; }
    #haut .navBtn:hover, #haut .navBtn.actif { background: rgba(255,255,255,.18); }
    #accueil { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 20px;
               padding: 20px; max-width: 1240px; margin: 0 auto; align-items: start; }
    #accueil > section { background: #fff; border-radius: 16px; padding: 18px 22px; min-width: 0; overflow: hidden; }
    #aRecherche { grid-column: span 6; }
    #aSugg { grid-column: span 2; background: #fdeee8 !important; }
    #aArbre { grid-column: span 4; }
    #aArbres, #aPhotos, #aJour { grid-column: span 2; }
    @media (max-width: 900px) { #accueil > section { grid-column: span 6 !important; } #accueil { padding: 12px; } }
    #accueil h2 { margin: 0 0 8px; font-size: 20px; color: var(--indigo); }
    #accueil h3 { margin: 14px 0 8px; font-size: 15px; color: var(--indigo); }
    #formRech { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
    #formRech input { flex: 1 1 180px; font: inherit; font-size: 15px; padding: 9px 12px; border: 1px solid #ddd5ee; border-radius: 8px; background: #fff; }
    #formRech button.action { margin: 0; border-radius: 20px; }
    .grilleRes { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; margin-top: 8px; }
    .ligneP { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; font: inherit; background: #fff;
              border: 1px solid #ece6f3; border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; cursor: pointer; }
    .ligneP:hover { border-color: var(--violet); }
    .ligneP b { display: block; font-size: 14px; }
    .ligneP small { color: var(--doux); }
    .ligneP .av { width: 38px; height: 38px; font-size: 14px; flex: none; }
    .large { width: 100%; margin: 4px 0 0 !important; border-radius: 20px; }
    .lienTitre { font: inherit; font-size: 24px; font-weight: 700; color: var(--violet); background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
    .carrouselBloc { display: flex; align-items: center; gap: 6px; }
    #carrousel { display: flex; gap: 12px; overflow-x: auto; padding: 6px 4px 12px; flex: 1; scroll-behavior: smooth; }
    #carrousel .carte { flex: none; }
    .carrouselBloc > button { font-size: 26px; line-height: 1; color: var(--violet); background: none; border: 0; cursor: pointer; padding: 6px; }
    .bandeau { display: flex; justify-content: space-around; gap: 12px; background: #fdeee8; padding: 16px 12px; text-align: center; margin: 14px -22px -18px; }
    .bandeau span { display: block; font-size: 14px; font-weight: 700; color: var(--doux); }
    .bandeau b { display: block; font-size: 28px; font-weight: 700; }
    .bandeau div:first-child b { color: var(--violet); }
    .entete2 { display: flex; justify-content: space-between; align-items: center; }
    .plusBtn { font-size: 24px; line-height: 1; color: var(--violet); background: none; border: 0; cursor: pointer; padding: 0 6px; }
    .ligneT { display: block; width: 100%; text-align: left; font: inherit; background: none; border: 0;
              border-bottom: 1px solid #ece6f3; padding: 10px 4px; cursor: pointer; color: var(--violet); }
    .ligneT small { display: block; color: var(--doux); }
    .ligneT.cur b { color: var(--indigo); }

    /* ===== Carte ===== */

    /* ----- Barre d'outils et arbre déplaçable ----- */

                     display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 16px; border-radius: 10px; }

    #arbre.pedigree { position: relative; overflow: hidden; padding: 0; height: calc(100vh - 300px); min-height: 480px;
                      cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; background: #fdfaff; border-radius: 10px; }

    #monde { position: absolute; left: 0; top: 0; transform-origin: 0 0; }

    #monde .nd { position: absolute; width: 112px; }
    #monde .nd .carte { width: 112px; height: 138px; overflow: hidden; }
    #monde .ph { position: absolute; width: 112px; height: 138px; font: inherit; font-size: 28px; color: var(--violet); background: #fff;
                 border: 2px dashed #cfc3ea; border-radius: 8px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; }

    #monde .ph:hover { border-color: var(--violet); }
    #monde .chev { position: absolute; width: 28px; height: 28px; padding: 0; font: inherit; font-size: 15px; line-height: 1; color: var(--violet);
                   background: #fff; border: 1px solid #cfc3ea; border-radius: 50%; cursor: pointer; }
    #monde .chev:hover { background: #f0e9fa; }
    .zoomCtl { position: absolute; left: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 6px; z-index: 5; }
    .zoomCtl button { width: 36px; height: 36px; font: inherit; font-size: 18px; color: var(--violet); background: #fff;
                      border: 1px solid #ddd5ee; border-radius: 8px; cursor: pointer; }

    .aideDrag { position: absolute; right: 12px; bottom: 10px; font-size: 12px; color: var(--doux); pointer-events: none; }
    dialog#dlgOutil { border: 0; border-radius: 16px; padding: 0; width: min(920px, 96vw); box-shadow: 0 10px 40px rgba(60, 40, 110, .30); }
    dialog#dlgOutil::backdrop { background: rgba(60, 40, 110, .40); }
    #dlgOutilCorps { padding: 16px 22px 22px; max-height: 70vh; overflow: auto; }

    #dlgOutilCorps .ligneP { margin-top: 6px; }

    .pick { margin-bottom: 14px; }

    .pickSel { margin-top: 6px; padding: 8px; background: #f6f1fb; border-radius: 8px; min-height: 20px; }
    .grosLien { font-size: 17px; margin: 6px 0 10px; padding: 12px 14px; background: #f0e9fa; border-radius: 10px; }
    .chaine { display: flex; flex-direction: column; align-items: stretch; }
    .chaine .etape { text-align: center; color: var(--doux); font-size: 13px; padding: 3px 0; }
    .reglage { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #ece6f3; }
    .reglage select { font: inherit; padding: 6px 8px; border-radius: 8px; border: 1px solid #d9d0ea; }
    .statsSuivi { display: flex; gap: 10px; flex-wrap: wrap; }
    .statsSuivi div { flex: 1 1 120px; background: #f6f1fb; border-radius: 10px; padding: 10px; text-align: center; }
    .statsSuivi b { display: block; font-size: 24px; color: var(--violet); }

    /* ----- Parenté : diagramme ----- */
    .pBadge { display: inline-block; font-size: 13px; padding: 3px 12px; border-radius: 8px; background: #ffe9ee; color: #a8456b; margin: 8px 0 4px; }

    .pLienH::after { content: ""; position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px; border-radius: 50%; background: #a995dc; }
    .pCol { display: flex; flex-direction: column; align-items: center; min-width: 260px; }
    .pDeux { display: flex; gap: 40px; justify-content: center; flex-wrap: wrap; }
    .pLien { width: 2px; height: 22px; background: #d8cdf0; }
    .pBox { background: #fff; border: 1px solid #d9d0ea; border-radius: 10px; padding: 8px 14px; min-width: 250px; max-width: 360px; }
    .pBox.dark { background: #6c58b8; border-color: #6c58b8; color: #fff; }
    .pBox.dark .pAn, .pBox.dark .pLab { color: #e5dcf7; }
    .pBox.dark .pNom, .pBox.dark .pCible { color: #fff; }
    .pLab { display: block; font-size: 12px; color: var(--doux); margin-bottom: 2px; }
    .pLigne { display: flex; align-items: center; gap: 8px; }
    .pNom { font: inherit; font-weight: 600; color: var(--violet); background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
    .pNom:hover { text-decoration: underline; }
    .pAn { font-style: italic; font-size: 13px; color: var(--doux); }
    .pCible { margin-left: auto; font: inherit; color: var(--doux); background: none; border: 0; padding: 2px; cursor: pointer; display: grid; place-items: center; }
    .pCible:hover { color: var(--violet); }
    .pSp { font-style: italic; margin-top: 8px; font-size: 14px; color: var(--doux); }
    .pSp .pNom { font-weight: 500; font-style: italic; }
    .pDiag .etape { font-size: 13px; color: var(--doux); }
    .pickers { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    @media (max-width: 700px) { .pickers { grid-template-columns: 1fr; } }

    /* ===== Bandeau pastel et finitions douces ===== */
    #haut, .dlgTete { background: linear-gradient(90deg, #fbd5cf, #f9c8dc 55%, #e0d4f7); color: #4a3a78; }
    #haut { box-shadow: 0 2px 12px rgba(150, 100, 190, .15); }
    #haut h1, #logo, #haut .menu > button, #haut .navBtn, .dlgTete button { color: #4a3a78; }
    #haut .menu > button:hover, #haut .navBtn:hover, #haut .navBtn.actif { background: rgba(108, 88, 184, .14); }
    #zoneArbre, #fiche, #accueil > section { box-shadow: 0 2px 14px rgba(120, 90, 180, .08); }
    .carte, .ligneP, .mini, .evJour, button.action, #formats button, #outils button, .chev, .zoomCtl button {
      transition: background-color .18s ease, border-color .18s ease, box-shadow .18s ease, transform .18s ease; }
    .carte:hover { transform: translateY(-1px); }
    button.action:hover { background: #6c58b8; border-color: #6c58b8; }
    button.action.clair:hover { background: #f6f1fb; }
    :focus-visible { outline-color: #b9a8ee; }
    #btnCloud { white-space: nowrap; }
    dialog#dlgCloud { border: 0; border-radius: 16px; padding: 0; width: min(420px, 94vw); box-shadow: 0 10px 40px rgba(60, 40, 110, .30); }
    dialog#dlgCloud::backdrop { background: rgba(60, 40, 110, .40); }
    .cloudCorps { padding: 16px 22px 22px; }
    .cloudCorps label { display: block; font-weight: 600; font-size: 13px; margin-top: 10px; }
    .cloudCorps input { width: 100%; font: inherit; padding: 9px 11px; border: 1px solid #ddd5ee; border-radius: 8px; }
    .cloudCorps .action { margin-bottom: 0; }
    #cloudMsg { margin: 12px 0 0; font-size: 14px; color: var(--doux); min-height: 20px; }

    /* ===== Fiche repliable et page proportionnelle à l'écran ===== */
    #page { grid-template-columns: minmax(0, 1fr) clamp(320px, 28vw, 440px); }
    #page.ficheOff { grid-template-columns: minmax(0, 1fr); }
    #page.ficheOff #fiche { display: none; }
    #fiche { position: sticky; top: 12px; max-height: calc(100vh - 92px); overflow-y: auto; overflow-x: hidden; }
    #entete { padding-right: 56px; }
    #fermerFiche { position: absolute; top: 10px; right: 12px; z-index: 2; width: 32px; height: 32px; border: 0;
                   border-radius: 50%; background: rgba(255, 255, 255, .22); color: #fff; font-size: 16px; cursor: pointer; }
    #fermerFiche:hover { background: rgba(255, 255, 255, .38); }
    .teteBtns { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: flex-end; }
    #btnFiche { font-weight: 700; text-decoration: none; background: #f0e9fa; padding: 7px 14px; border-radius: 20px; }
    #btnFiche:hover { background: #e6ddf7; }
    #arbre.pedigree { height: calc(100vh - 312px); min-height: 380px; }
    @media (max-width: 900px) {
      #page { grid-template-columns: 1fr; }
      #fiche { position: static; max-height: none; overflow: visible; }
      #arbre.pedigree { height: 70vh; }
    }
    @media print { #fiche { display: none !important; } }

    /* ===== Fiche en grand (façon Filae) ===== */
    #agrandirFiche { position: absolute; top: 10px; right: 52px; z-index: 2; width: 32px; height: 32px; border: 0;
                     border-radius: 50%; background: rgba(255, 255, 255, .22); color: #fff; font-size: 16px; cursor: pointer; }
    #agrandirFiche:hover { background: rgba(255, 255, 255, .38); }
    #entete { padding-right: 96px; }
    .actionsXL { display: none; }
    #page.ficheXL { grid-template-columns: minmax(0, 1fr); max-width: 1500px; margin: 0 auto; }
    #page.ficheXL #arbre, #page.ficheXL #btnFiche, #page.ficheXL #fermerFiche, #page.ficheXL #agrandirFiche { display: none !important; }
    #page.ficheXL.ficheOff #fiche { display: block; }
    #page.ficheXL #fiche { position: static; max-height: none; overflow: hidden; }
    #page.ficheXL #entete { padding: 28px 34px; gap: 26px; }
    #page.ficheXL #entete .av { width: 112px; height: 112px; font-size: 40px; }
    #page.ficheXL #entete h2 { font-size: 34px; margin-bottom: 6px; }
    #page.ficheXL #entete p { font-size: 17px; }
    #page.ficheXL .actionsXL { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 28px; background: #f6f1fb; }
    .actionsXL button { font: inherit; font-weight: 700; color: var(--violet); background: none; border: 0;
                        padding: 9px 16px; border-radius: 10px; cursor: pointer; }
    .actionsXL button:hover { background: #ede6fa; }
    #page.ficheXL #relations { padding: 16px 34px 0; }
    #page.ficheXL #ficheCols { display: grid; grid-template-columns: minmax(0, 1fr) clamp(300px, 30vw, 440px);
                               gap: 30px; padding: 0 34px 18px; align-items: start; }
    #page.ficheXL #onglets { padding: 14px 0 0; }
    #page.ficheXL #onglets button[data-o="famille"] { display: none; }
    #page.ficheXL #vueFiche, #page.ficheXL #vueDocs, #page.ficheXL #vueNotes, #page.ficheXL #vueModifier { padding: 18px 0 6px; }
    #page.ficheXL #colD { padding-top: 14px; }
    #page.ficheXL #vueFamille { background: #f6f1fb; border-radius: 14px; padding: 16px 18px 10px; }
    #page.ficheXL #vueFamille::before { content: "Famille"; display: inline-block; font-weight: 700; color: var(--violet);
      background: #fff; border: 1.5px solid #cfc3ea; border-radius: 8px; padding: 7px 16px; margin-bottom: 4px; }
    #page.ficheXL .tete { display: none; }
    #page.ficheXL #outils { padding-top: 10px; }
    #page.ficheXL .mini { background: #fff; }
    #page.ficheXL #msg { padding: 0 34px; }
    #page.ficheXL #effacer { margin: 8px 34px 20px; }
    @media (max-width: 900px) {
      #page.ficheXL #ficheCols { grid-template-columns: 1fr; padding: 0 16px 16px; }
      #page.ficheXL #entete { padding: 20px 18px; }
      #page.ficheXL #relations { padding: 14px 18px 0; }
      #page.ficheXL #entete .av { width: 72px; height: 72px; font-size: 26px; }
      #page.ficheXL #entete h2 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <header id="haut">
    <h1><button type="button" id="logo">Ma généalogie</button></h1>
    <button type="button" id="btnAccueil" class="navBtn actif">Accueil</button>
    <div class="menu">
      <button type="button" id="btnArbres" aria-haspopup="true">Arbres ▾</button>
      <div id="menuArbres" hidden></div>
    </div>
    <div class="recherche">
      <input id="rech" type="search" placeholder="Rechercher une personne" autocomplete="off" aria-label="Rechercher une personne">
      <div id="resRech" hidden></div>
    </div>
    <button type="button" id="btnCloud" class="navBtn">☁ Connexion</button>
  </header>
  <dialog id="dlgCloud">
    <div class="dlgTete"><h2>Sauvegarde dans le cloud</h2><button type="button" id="cloudFermer" aria-label="Fermer">✕</button></div>
    <div id="cloudCorps" class="cloudCorps"></div>
  </dialog>

  <div id="accueil">
    <section id="aRecherche">
      <h2>Rechercher une personne</h2>
      <p class="doux">La recherche porte sur tous vos arbres.</p>
      <form id="formRech" autocomplete="off">
        <input id="rNom" placeholder="Nom" aria-label="Nom">
        <input id="rPrenom" placeholder="Prénom(s)" aria-label="Prénom">
        <input id="rLieu" placeholder="Commune ou département" aria-label="Lieu">
        <button class="action" type="submit">Rechercher</button>
      </form>
      <div id="resultats"></div>
    </section>
    <section id="aSugg"></section>
    <section id="aArbre"></section>
    <section id="aArbres"></section>
    <section id="aPhotos"></section>
    <section id="aJour"></section>
  </div>

  <div id="page">
    <main id="zoneArbre">
      <div class="tete">
        <div>
          <h2 id="nomArbre"></h2>
          <p id="majArbre"></p>
        </div>
        <div class="teteBtns">
          <button type="button" id="btnFiche" class="lien-btn" aria-expanded="true">Masquer la fiche ▸</button>
          <button type="button" id="renommerArbre" class="lien-btn">Renommer</button>
        </div>
      </div>
      <div id="outils" role="toolbar" aria-label="Outils">
        <button type="button" data-o="recherche"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="M15 15l5 5"/><circle cx="10" cy="8" r="1.6"/><path d="M7 12.5c1-1.4 5-1.4 6 0"/></svg>Recherche</button>
        <button type="button" data-o="suivi"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M8.5 12.5l2 2 4-4.5"/></svg>Suivi</button>
        <button type="button" data-o="parente"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M11 8.3L7 15.7M13 8.3l4 7.4"/></svg>Parenté</button>
        <button type="button" data-o="imprimer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 9V3h10v6M7 17H4v-7h16v7h-3"/><rect x="7" y="14" width="10" height="7"/></svg>Imprimer</button>
        <button type="button" data-o="listes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg>Listes</button>
        <button type="button" data-o="reglages"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>Réglages</button>
      </div>

      <div id="arbre"></div>

    <aside id="fiche">

      <button type="button" id="agrandirFiche" title="Afficher la fiche en grand" aria-label="Afficher la fiche en grand">⤢</button>

      <div id="actionsXL" class="actionsXL">
        <button type="button" data-act="arbre">🌳 Voir dans l’arbre</button>
        <button type="button" data-act="modifier">✎ Modifier</button>
      </div>
      <div id="relations"></div>
      <div id="ficheCols"><div id="colG">

      <div id="vueFiche"></div>
      <div id="vueDocs"></div>
      <div id="vueNotes"></div>
      <div id="vueModifier">
      <h2 id="titre"></h2>
      <p id="aide"></p>
      <form id="formulaire" autocomplete="off">
        <div class="deux">
          <div>
            <label for="prenom">Prénom</label>
            <input id="prenom">
          </div>
          <div>
            <label for="nom">Nom</label>
            <input id="nom">
          </div>
        </div>

        <label for="sexe">Sexe</label>
        <select id="sexe" required>
          <option value="">Choisir…</option>
          <option value="H">Homme</option>
          <option value="F">Femme</option>
        </select>

        <div class="groupe">

              <label for="lieuNaissance">Lieu</label>
              <input id="lieuNaissance" placeholder="Périgueux">

              <input id="deces">

              <label for="lieuDeces">Lieu</label>
              <input id="lieuDeces">
            </div>
          </div>
        </div>

        <div class="groupe">

              <label for="mariage">Date du mariage</label>

            <div>
              <label for="lieuMariage">Lieu</label>
              <input id="lieuMariage">

            <div>
              <label for="divorce">Date du divorce (si divorcés)</label>

              <label for="lieuDivorce">Lieu</label>
              <input id="lieuDivorce">

          </div>
        </div>

        <details class="groupe" id="militaire">

          <input id="armee" placeholder="Guerre 1914-1918, service national…">

            <div>
              <label for="unite">Régiment / unité</label>

            <div>
              <label for="periodeMilitaire">Période</label>

            <div>
              <label for="matricule">Matricule</label>
